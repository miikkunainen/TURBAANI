/* ── tila ────────────────────────────────────────────────────────────────── */

function K() {
  S.kysely = S.kysely || {};
  const k = S.kysely;
  k.vast = k.vast || {};
  k.lahde = k.lahde || 'haastattelu';
  k.luovit = k.luovit || [];
  k.loki = k.loki || [];
  return k;
}
const V = id => { const v = K().vast[id]; return v && v.ohitettu ? '' : (v || ''); };
const vastattu = id => id in K().vast;

function reitti() {
  const out = [];
  SATAMAT.forEach(s => {
    out.push(s);
    const l = Object.values(LUOVINNAT).find(x => x.isa === s.id && K().luovit.includes(x.id));
    if (l) out.push(l);
  });
  return out;
}
function nykyinen() { return reitti().find(s => !vastattu(s.id)) || null; }

function minimiTayttyy() {
  return (V('luovi_ratkaisu') || V('haaste')).trim().length >= 15
      && (V('luovi_kaikki') || V('kenelle')).trim().length >= 3
      && (rivit(V('oletukset')).length + rivit(V('luovi_oletus')).length) >= 1;
}

function tuuli() {
  const l = K().loki;
  if (!l.length) return { laji: 'tyyni', voima: 0 };
  const viim = l[l.length - 1].tuuli;
  if (viim !== 'myota') return { laji: viim, voima: 1 };
  let n = 0;
  for (let i = l.length - 1; i >= 0 && l[i].tuuli === 'myota'; i--) n++;
  return { laji: 'myota', voima: Math.min(3, n) };
}

function hmwEhdotus() {
  const h = stripDot(V('luovi_ratkaisu') || V('haaste'));
  if (!h) return 'Miten voisimme ';
  return `Miten voisimme korjata sen, että ${lowerFirst(h)}?`;
}

/* ── lasti: mitä on kerätty ja minne se menee ────────────────────────────── */

function lasti() {
  const ol = rivit(V('oletukset')).length + rivit(V('luovi_oletus')).length;
  const loyd = rivit(V('nahty')).length + rivit(V('kuultu')).length;
  const krit = rivit(V('pakko')).length;
  const ideat = rivit(V('ideat')).length + (V('luovi_ratkaisu') ? 1 : 0);
  return [
    { a: 0, n: 'Aloitus', t: `${(V('haaste') ? 1 : 0) + ((V('kenelle') || V('luovi_kaikki')) ? 1 : 0)} / 2 perustietoa · ${ol} oletusta`,
      p: Math.min(1, ((V('haaste') ? 1 : 0) + ((V('kenelle') || V('luovi_kaikki')) ? 1 : 0) + Math.min(ol, 2)) / 4) },
    { a: 1, n: 'Discover', t: `${loyd} löydöstä`, p: Math.min(1, loyd / 5) },
    { a: 2, n: 'Define', t: `${V('oivallus') ? 1 : 0} oivallus · ${krit} kriteeriä`,
      p: Math.min(1, ((V('oivallus') ? 1 : 0) + Math.min(krit, 3)) / 4) },
    { a: 3, n: 'Toimeksianto', t: `${['onnistuminen', 'rajaus', 'hmw'].filter(x => V(x)).length} / 3`,
      p: ['onnistuminen', 'rajaus', 'hmw'].filter(x => V(x)).length / 3 },
    { a: 4, n: 'Develop', t: `${ideat} ideaa odottaa`, p: Math.min(1, ideat / 3) }
  ];
}

/* ── merikortti ──────────────────────────────────────────────────────────── */

function kartta() {
  const R = reitti(), W = 960, H = 250;
  const cur = nykyinen();
  const curIdx = cur ? R.indexOf(cur) : R.length;
  const n = R.length;
  const step = (W - 116) / n;
  const P = [];
  for (let k = 0; k <= n; k++) {
    const s = R[k];
    const x = 58 + k * step;
    let y = 152 + Math.sin(k * 1.05) * 34;
    if (s && s.luovinta) y -= 46;
    P.push({ x, y });
  }

  let g = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Merikortti: aloituskyselyn reitti">`;
  g += `<rect x="0" y="0" width="${W}" height="${H}" rx="10" fill="var(--sea)"/>`;
  for (let i = 0; i < 4; i++) {
    const yy = 54 + i * 52;
    g += `<path d="M0 ${yy} q 40 -6 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0" fill="none" stroke="var(--sea-2)" stroke-width="1.4"/>`;
  }

  /* alueet: ryhmitellään peräkkäiset samaan alueeseen kuuluvat satamat */
  let k0 = 0;
  while (k0 < n) {
    const a = R[k0].alue;
    let k1 = k0;
    while (k1 + 1 < n && R[k1 + 1].alue === a) k1++;
    const x0 = P[k0].x - step / 2, x1 = P[k1].x + step / 2;
    g += `<rect x="${x0 + 2}" y="22" width="${x1 - x0 - 4}" height="${H - 34}" rx="8" fill="${ALUE[a].c}" opacity=".06"/>`;
    g += `<text x="${(x0 + x1) / 2}" y="38" text-anchor="middle" class="kk-alue" fill="${ALUE[a].c}">${ALUE[a].n}</text>`;
    k0 = k1 + 1;
  }

  /* reitti: kuljettu yhtenäisenä, tuleva katkoviivana, luovinta siksakkina */
  const seg = (a, b, lu) => {
    if (!lu) return `M${a.x} ${a.y} L${b.x} ${b.y}`;
    let d = `M${a.x} ${a.y}`;
    for (let j = 1; j <= 5; j++) {
      const t = j / 6, x = a.x + (b.x - a.x) * t, y = a.y + (b.y - a.y) * t + (j % 2 ? -11 : 11);
      d += ` L${x.toFixed(1)} ${y.toFixed(1)}`;
    }
    return d + ` L${b.x} ${b.y}`;
  };
  for (let k = 0; k < n; k++) {
    const lu = (R[k + 1] && R[k + 1].luovinta) || R[k].luovinta;
    const done = k < curIdx;
    g += `<path d="${seg(P[k], P[k + 1], lu)}" fill="none" stroke="${done ? 'var(--sea-ink)' : 'var(--sea-ink)'}" stroke-width="${done ? 2.4 : 1.6}" ${done ? '' : 'stroke-dasharray="5 6" opacity=".55"'}/>`;
  }

  /* satamat: avatut, nykyinen, suljetut luukut */
  R.forEach((s, k) => {
    const p = P[k], col = ALUE[s.alue].c;
    const ans = vastattu(s.id), isCur = k === curIdx;
    const lab = esc(s.nimi);
    if (ans) {
      g += `<g class="kk-s kk-auki" role="button" tabindex="0" data-kk="${s.id}" aria-label="${lab}: avattu, muokkaa">`;
      g += `<circle cx="${p.x}" cy="${p.y}" r="22" fill="transparent"/>`;
      g += `<circle cx="${p.x}" cy="${p.y}" r="11" fill="${col}"/>`;
      g += `<text x="${p.x}" y="${p.y + 4}" text-anchor="middle" class="kk-n" fill="#fff">${K().vast[s.id] && K().vast[s.id].ohitettu ? '–' : '✓'}</text>`;
      g += `</g>`;
    } else if (isCur) {
      g += `<circle cx="${p.x}" cy="${p.y}" r="15" fill="var(--card)" stroke="${col}" stroke-width="3"/>`;
      g += `<text x="${p.x}" y="${p.y + 4}" text-anchor="middle" class="kk-n" fill="${col}">${k + 1}</text>`;
    } else {
      g += `<g aria-hidden="true"><rect x="${p.x - 10}" y="${p.y - 10}" width="20" height="20" rx="4" fill="var(--card)" stroke="var(--line)" stroke-width="1.4"/>`;
      g += `<text x="${p.x}" y="${p.y + 4}" text-anchor="middle" class="kk-n" fill="var(--ink-3)">${k + 1}</text></g>`;
    }
    if (s.luovinta) g += `<text x="${p.x}" y="${p.y + 27}" text-anchor="middle" class="kk-lu" fill="${col}">luovinta</text>`;
  });

  /* määränpää: kaksoistimantti */
  const f = P[n];
  const valmis = !cur;
  g += `<g class="kk-maali${valmis ? ' on' : ''}" transform="translate(${f.x},${f.y})" aria-hidden="true">`;
  g += `<path d="M-22 0 L-12 -11 L-2 0 L-12 11 Z" fill="${valmis ? 'var(--d1)' : 'none'}" stroke="var(--d1)" stroke-width="2"/>`;
  g += `<path d="M2 0 L12 -11 L22 0 L12 11 Z" fill="${valmis ? 'var(--d2)' : 'none'}" stroke="var(--d2)" stroke-width="2"/>`;
  g += `</g>`;
  g += `<text x="${f.x}" y="${f.y + 30}" text-anchor="middle" class="kk-alue" fill="var(--ink-2)">KAKSOISTIMANTTI</text>`;

  /* vene nykyisessä satamassa tai määränpäässä */
  const bp = cur ? P[curIdx] : f;
  g += `<g class="vene" transform="translate(${bp.x - (cur ? 30 : 0)},${bp.y - (cur ? 2 : 30)})" aria-hidden="true">`;
  g += `<path d="M-15 0 L15 0 L10 7 L-10 7 Z" fill="var(--ink)"/>`;
  g += `<line x1="0" y1="0" x2="0" y2="-24" stroke="var(--ink)" stroke-width="1.6"/>`;
  g += `<path d="M1 -23 L1 -3 L14 -5 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="1.2"/>`;
  g += `<path d="M-1 -20 L-1 -4 L-10 -5 Z" fill="var(--card)" stroke="var(--ink)" stroke-width="1.2"/>`;
  g += `</g>`;
  g += `</svg>`;
  return g;
}

/* ── näkymä ──────────────────────────────────────────────────────────────── */

let LUUKKU = null;   /* juuri avattu luukku — ei tallenneta */
let MUOKKAA = null;  /* jo vastatun sataman muokkaus */

function viewKysely(m) {
  const k = K();
  const R = reitti();
  const cur = MUOKKAA ? R.find(s => s.id === MUOKKAA) : nykyinen();
  const tu = tuuli();

  const head = el('div', { class: 'kk-head' }, [
    el('div', {}, [
      el('div', { class: 'eyebrow ew', text: 'ALOITUSKYSELY · PURJEHDUS' }),
      el('h2', { text: 'Satamasta satamaan kohti kaksoistimanttia' })
    ]),
    el('div', { class: 'tuuli tuuli-' + tu.laji, role: 'status' }, [
      el('span', { class: 'tuuli-n', text: tu.laji === 'myota' ? '➝'.repeat(tu.voima) : tu.laji === 'vasta' ? '⤳' : '·' }),
      el('span', { text: tu.laji === 'myota' ? 'Myötätuuli' : tu.laji === 'vasta' ? 'Vastatuuli — luovitaan' : 'Tyyntä' })
    ])
  ]);

  const chart = el('div', { class: 'kk-kartta', html: kartta() });
  chart.querySelectorAll('[data-kk]').forEach(gn => {
    const go = () => { MUOKKAA = gn.dataset.kk; LUUKKU = null; render(); };
    gn.addEventListener('click', go);
    gn.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });

  /* Kapealla näytöllä kortti vierii sivuttain ja vene keskitetään näkyviin. */
  setTimeout(() => {
    const b = chart.querySelector('.vene');
    if (!b || chart.scrollWidth <= chart.clientWidth) return;
    const r = b.getBoundingClientRect(), c = chart.getBoundingClientRect();
    chart.scrollLeft += r.left - c.left - c.width / 2;
  }, 0);

  const done = R.filter(s => vastattu(s.id)).length;
  const prog = el('div', { class: 'kk-prog' }, [
    el('span', { text: `${done} / ${R.length} satamaa` }),
    k.luovit.length ? el('span', { text: `· ${k.luovit.length} luovintaa` }) : null
  ]);

  const wrap = el('section', { class: 'stage kk' }, [head, chart, prog]);
  const grid = el('div', { class: 'kk-grid' });
  const vasen = el('div', {});
  const oikea = el('aside', { class: 'kk-lasti' });

  if (!k.aloitettu) vasen.append(tervetuloa());
  else if (LUUKKU) vasen.append(luukkuAuki(LUUKKU));
  else if (cur) vasen.append(kysymys(cur));
  else vasen.append(maali());

  oikea.append(lastiPaneeli());
  if (minimiTayttyy() && cur && k.aloitettu && !LUUKKU) {
    oikea.append(el('div', { class: 'kk-valmis' }, [
      el('b', { text: 'Riittävästi tietoa matkaan' }),
      el('p', { text: 'Voit avata kaksoistimantin jo nyt — tieto asettuu oikeisiin kohtiin — tai jatkaa purjehdusta.' }),
      el('button', { class: 'btn', text: 'Avaa kaksoistimantti', on: { click: avaaTimantti } })
    ]));
  }

  grid.append(vasen, oikea);
  wrap.append(grid);
  m.append(wrap);
}

function tervetuloa() {
  return el('div', { class: 'kk-kortti kk-tervetuloa' }, [
    el('h3', { text: 'Lähdetään purjehdukselle' }),
    el('p', { text: 'Kartalla on satamia. Jokainen on suljettu luukku: se aukeaa, kun vastaat kysymykseen, ja luukun alta näet mitä vastauksestasi seuraa ja mihin kohtaan kaksoistimanttia se asettuu.' }),
    el('p', { text: 'Jos vastaus kaipaa tarkennusta, reitti luovii — kartalle ilmestyy kiemura ja yksi lisäsatama. Vastatuulessakin pääsee perille, kun kulkee kulmassa.' }),
    el('p', { class: 'kk-huom', text: 'Päättely on sääntöpohjaista: se yhdistää vastauksesi menetelmän rakenteeseen, ei arvaa sisältöä. Mitään ei kirjoiteta kaksoistimanttiin ennen kuin itse avaat sen.' }),
    el('div', { class: 'nav' }, [
      el('button', { class: 'btn', text: 'Siirry suoraan työkaluun',
        on: { click: () => { K().ohitettu = true; S.stage = 0; save(); render(); } } }),
      el('button', { class: 'btn pri', text: 'Nosta purjeet →',
        on: { click: () => { K().aloitettu = true; save(); render(); } } })
    ])
  ]);
}

function kysymys(s) {
  const muokkaus = MUOKKAA === s.id;
  const card = el('div', { class: 'kk-kortti' + (s.luovinta ? ' kk-luovi' : '') });
  card.append(
    el('div', { class: 'kk-sat' }, [
      el('span', { class: 'kk-alue-l', style: `color:${ALUE[s.alue].c}`, text: ALUE[s.alue].n }),
      el('span', { text: ' · ' + s.nimi }),
      s.luovinta ? el('span', { class: 'kk-lu-chip', text: '⤳ luovinta' }) : null
    ])
  );
  let esit = s.esittely;
  if (s.id === 'luovi_kriteeri') {
    const vg = rivit(V('pakko')).find(r => VAGUE_KR.test(r)) || '';
    esit = `Vastatuuli: väylämerkki "${vg}" on sellainen, jonka jokainen ratkaisu voi väittää täyttävänsä. Muotoile se niin, että kaksi ratkaisua voi saada siitä eri arvion.`;
  }
  card.append(el('p', { class: 'kk-esit', text: esit }));
  card.append(el('h3', { class: 'kk-kys', text: s.kys }));

  const vanha = K().vast[s.id];
  let arvo = vanha && !vanha.ohitettu ? vanha : '';
  if (!arvo && s.tyyppi === 'hmw') arvo = hmwEhdotus();

  const ta = el('textarea', {
    class: 'kk-in', id: 'kkIn', rows: s.tyyppi === 'text' ? '3' : '5',
    placeholder: s.vihje || (s.tyyppi.startsWith('lines') ? 'Yksi per rivi' : ''),
    'aria-label': s.kys
  });
  ta.value = arvo;
  card.append(ta);
  if (s.tyyppi.startsWith('lines')) card.append(el('p', { class: 'kk-pieni', text: 'Yksi asia per rivi. Voit sanella puhelimen näppäimistön mikrofonilla.' }));

  let sel = null;
  if (s.tyyppi === 'lines+lahde') {
    sel = el('select', { id: 'kkLahde' }, LAHDE.map(([v, l]) => el('option', { value: v, text: l, selected: K().lahde === v || null })));
    card.append(el('label', { class: 'f', style: 'margin-top:10px' }, [el('span', { text: 'Mistä tämä tieto on peräisin?' }), sel]));
  }

  const msg = el('p', { class: 'kk-msg', role: 'status', 'aria-live': 'polite' });
  card.append(msg);

  const laheta = () => {
    const v = ta.value.trim();
    if (s.min && v.length < s.min && !s.valinnainen) {
      msg.textContent = s.tyyppi === 'text' ? 'Kirjoita vähän enemmän — yksi lause riittää.' : 'Kirjoita ainakin yksi rivi.';
      ta.focus(); return;
    }
    if (!v && !s.valinnainen && s.tyyppi !== 'lines') {
      msg.textContent = 'Tähän tarvitaan vastaus — keskeneräinen kelpaa.'; ta.focus(); return;
    }
    if (sel) K().lahde = sel.value;
    tallennaVastaus(s, v);
  };

  const nav = el('div', { class: 'nav' });
  const takaisin = R => {
    const ed = R[Math.max(0, R.indexOf(s) - 1)];
    return ed && ed.id !== s.id ? ed : null;
  };
  const ed = takaisin(reitti());
  nav.append(el('div', { style: 'display:flex;gap:8px;flex-wrap:wrap' }, [
    ed ? el('button', { class: 'btn', text: '← Edellinen satama',
      on: { click: () => { MUOKKAA = ed.id; LUUKKU = null; render(); } } }) : null,
    s.valinnainen ? el('button', { class: 'btn', text: 'Ohita',
      on: { click: () => tallennaVastaus(s, null) } }) : null,
    muokkaus ? el('button', { class: 'btn', text: 'Peruuta',
      on: { click: () => { MUOKKAA = null; render(); } } }) : null
  ]));
  nav.append(el('button', { class: 'btn pri', text: muokkaus ? 'Tallenna' : 'Vastaa ja avaa luukku →', on: { click: laheta } }));
  card.append(nav);
  ta.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) laheta(); });
  setTimeout(() => { try { ta.focus({ preventScroll: true }); } catch (e) {} }, 40);
  return card;
}

function tallennaVastaus(s, v) {
  const k = K();
  const muokkaus = MUOKKAA === s.id;
  k.vast[s.id] = v === null ? { ohitettu: true } : v;

  /* luovinta laukeaa vain kerran — se jää reittiin historiaksi */
  let lu = null;
  if (s.luovi) {
    lu = s.luovi(v || '');
    if (lu && !k.luovit.includes(lu)) k.luovit.push(lu);
    else lu = null;
  }
  const tuuliNyt = lu ? 'vasta' : v === null ? 'tyyni' : 'myota';
  if (!muokkaus) k.loki.push({ id: s.id, tuuli: tuuliNyt, ts: Date.now() });

  MUOKKAA = null;
  LUUKKU = muokkaus ? null : { id: s.id, tuuli: tuuliNyt, luovi: lu };
  save(); render();
  if (muokkaus) toast('Satama päivitetty.');
}

/* Määränpää: lastiluettelo ja päätelty ensimmäinen reitti kaksoistimantissa */
function seuraavatAskeleet() {
  const out = [];
  const ol = [...rivit(V('oletukset')), ...rivit(V('luovi_oletus'))];
  const omat = rivit(V('nahty')).length;
  const krit = rivit(V('pakko')).length;
  if (ol.length) out.push(`Koettele karikko "${ol[0]}" — kysy tai katso itse, pitääkö se paikkansa.`);
  if (V('luovi_havainto')) out.push(`Tee ensimmäinen luotaus: ${V('luovi_havainto')}.`);
  else if (omat < 2) out.push('Tee vähintään kaksi omaa havaintoa ennen kuin jäsennät — muiden kartat eivät korvaa omaa luotausta.');
  if (krit < 3) out.push(`Johda vielä ${3 - krit} väylämerkkiä, jotta ratkaisuja voi suppiloida.`);
  if (V('hmw')) out.push('Toimeksianto odottaa lukitusta: lukitse se vasta, kun ensimmäisen timantin tieto on koeteltu.');
  if (!out.length) out.push('Reitti on valmis. Jatka kaksoistimantissa siitä vaiheesta, jonka portti on vielä auki.');
  return out;
}

/* ── siirto kaksoistimanttiin ────────────────────────────────────────────── */

function kyselyKayttoon() {
  const lisatty = { oletukset: 0, loydokset: 0, oivallukset: 0, kriteerit: 0, ideat: 0 };
  const idea = V('luovi_ratkaisu') || V('haaste');
  if (idea && !S.input.idea.trim()) S.input.idea = idea;
  const ken = V('luovi_kaikki') || V('kenelle');
  if (ken && !S.input.kenelle.trim()) S.input.kenelle = ken;
  if (V('miksinyt') && !S.input.miksinyt.trim()) S.input.miksinyt = V('miksinyt');

  const olOn = new Set(oletukset());
  [...rivit(V('oletukset')), ...rivit(V('luovi_oletus'))].forEach(o => {
    if (!olOn.has(o)) { S.input.oletukset = (S.input.oletukset ? S.input.oletukset + '\n' : '') + o; olOn.add(o); lisatty.oletukset++; }
  });

  const fOn = new Set(S.finds.map(f => f.t));
  rivit(V('nahty')).forEach(t => {
    if (fOn.has(t)) return;
    S.finds.push({ id: uid(), t, met: 'Havainnointi', laji: 'havainto', teema: 'Omat havainnot', koe: null, round: S.round });
    fOn.add(t); lisatty.loydokset++;
  });
  const L = LAHDE.find(x => x[0] === K().lahde) || LAHDE[0];
  rivit(V('kuultu')).forEach(t => {
    if (fOn.has(t)) return;
    S.finds.push({ id: uid(), t, met: L[2], laji: L[3], teema: 'Kuultu ja luettu', koe: null, round: S.round });
    fOn.add(t); lisatty.loydokset++;
  });

  let insId = null;
  if (V('oivallus') && !S.insights.some(i => i.t === V('oivallus'))) {
    insId = uid();
    const teema = rivit(V('nahty')).length ? 'Omat havainnot' : 'Kuultu ja luettu';
    S.insights.push({ id: insId, t: V('oivallus'), teema, round: S.round });
    lisatty.oivallukset++;
  }

  let kr = rivit(V('pakko'));
  const vg = kr.find(r => VAGUE_KR.test(r));
  if (vg && V('luovi_kriteeri')) kr = kr.map(r => r === vg ? V('luovi_kriteeri') : r);
  const kOn = new Set(S.criteria.map(c => c.t));
  kr.forEach(t => {
    if (kOn.has(t)) return;
    S.criteria.push({ id: uid(), t, from: insId, round: S.round });
    kOn.add(t); lisatty.kriteerit++;
  });

  if (V('onnistuminen') && !S.brief.mittarit.trim()) S.brief.mittarit = V('onnistuminen');
  if (V('rajaus') && !S.brief.ulkopuolella.trim()) S.brief.ulkopuolella = V('rajaus');
  if (V('hmw') && !S.brief.hmw.trim()) S.brief.hmw = V('hmw');

  const cOn = new Set(S.concepts.map(c => c.kuvaus));
  const ideat = rivit(V('ideat'));
  if (V('luovi_ratkaisu') && V('haaste')) ideat.unshift(V('haaste'));
  ideat.forEach(t => {
    if (cOn.has(t)) return;
    S.concepts.push({ id: uid(), nimi: t.slice(0, 40), kuvaus: t, hybrid: null, round: S.round });
    cOn.add(t); lisatty.ideat++;
  });

  if (V('luovi_havainto')) S.kyselyTehtava = V('luovi_havainto');
  K().valmis = true;
  return lisatty;
}

/* Laskeudutaan siihen vaiheeseen, jonka portti on ensimmäisenä auki. */
function laskeutumisVaihe() {
  const ensi = S.finds.filter(f => metLaji(f.met) === 'ensi').length;
  if (S.input.idea.trim().length <= 15 || !oletukset().length) return 0;
  if (S.finds.length < 5 || new Set(S.finds.map(f => f.met)).size < 2
      || new Set(S.finds.map(f => f.teema)).size < 2 || !ensi) return 1;
  if (S.insights.length < 2 || S.criteria.length < 3 || !S.criteria.some(c => c.from)) return 2;
  return 3;
}

function avaaTimantti() {
  const l = kyselyKayttoon();
  S.stage = laskeutumisVaihe();
  LUUKKU = null; MUOKKAA = null;
  save(); render();
  const osat = [];
  if (l.oletukset) osat.push(`${l.oletukset} oletusta`);
  if (l.loydokset) osat.push(`${l.loydokset} löydöstä`);
  if (l.oivallukset) osat.push(`${l.oivallukset} oivallus`);
  if (l.kriteerit) osat.push(`${l.kriteerit} kriteeriä`);
  if (l.ideat) osat.push(`${l.ideat} ideaa`);
  toast(`Tieto asettui kaksoistimanttiin${osat.length ? ': ' + osat.join(', ') : ''}. Jatka vaiheesta ${stageName(S.stage)}.`);
}

function viewSummary(m) {

  m.append(briefCard());

  m.append(el('div', { class: 'pairlab out', text: 'TÄLLÄ HOMMA HOITUU' }));
  if (S.final.picked.length) {
    const items = el('div', { class: 'items outbox' });
    S.final.picked.forEach(id => {
      const c = S.concepts.find(x => x.id === id);
      if (!c) return;
      items.append(el('div', { class: 'item' }, [
        el('div', { style: 'font-weight:600', text: c.nimi }),
        el('div', { style: 'font-size:.9rem;color:var(--ink-2);margin-top:3px', text: c.kuvaus }),

      ]));
    });

  } else m.append(el('div', { class: 'empty', text: 'Ei vielä valintaa — suppilointi on kesken.' }));

  if (S.final.miksi.trim()) {
    m.append(el('h4', { style: 'margin:18px 0 5px;font-size:.92rem', text: 'Perustelu' }));
    m.append(el('p', { text: S.final.miksi }));
  }

  /* ketju näkyviin: mistä kukin asia tuli */
  m.append(el('hr', { class: 'hr' }));
  m.append(el('h3', { style: 'margin:0 0 10px;font-size:1.1rem', text: 'Mistä tämä on peräisin' }));
  const chain = el('div', { class: 'items' });
  [
    ['Lähtökohta', S.input.idea || '—'],
    [`${S.finds.length} löydöstä`, `${new Set(S.finds.map(f => f.met)).size} menetelmää, ${new Set(S.finds.map(f => f.teema)).size} teemaa`],
    [`${S.insights.length} oivallusta`, S.insights.map(i => i.t).join(' · ') || '—'],
    [`${S.criteria.length} kriteeriä`, S.criteria.map(k => k.t).join(' · ') || '—'],
    [`${S.concepts.length} ratkaisua`, S.concepts.map(c => c.nimi).join(' · ') || '—'],
    [`${Object.keys(S.screenOut).length} pudotettu seulonnassa`,
      S.concepts.filter(c => S.screenOut[c.id]).map(c => c.nimi).join(' · ') || 'ei yhtään']
  ].forEach(([a, b]) => {
    chain.append(el('div', { class: 'item' }, [
      el('div', { style: 'font-weight:600;font-size:.9rem', text: a }),
      el('div', { style: 'font-size:.88rem;color:var(--ink-2);margin-top:2px', text: b })
    ]));
  });
  m.append(chain);

  /* koettelemattomat oletukset kulkevat tänne asti — se on syytä sanoa */
  const ol = oletukset();
  const koet = new Set(S.finds.filter(f => f.koe !== null).map(f => f.koe));
  const auki = ol.filter((_, i) => !koet.has(i));
  if (auki.length) m.append(el('div', { class: 'note warn' }, [
    el('b', { text: `${auki.length} lähtöoletusta jäi koettelematta` }),
    el('p', { text: auki.join(' · ') }),
    el('p', { text: 'Nämä kulkivat koko prosessin läpi tarkistamatta. Jos valinta osoittautuu vääräksi, syy on todennäköisesti täällä.' })
  ]));

  /* Deliver ei pääty valintaan: mukana kulkee se, mitä toteuttajalle
     luovutetaan ja mistä myöhemmin tiedetään onnistuiko ratkaisu. */

  m.append(el('h3', { style: 'margin:0 0 6px;font-size:1.1rem', text: 'Mitä luovutetaan eteenpäin' }));
  m.append(el('p', { style: 'font-size:.9rem;color:var(--ink-2)', text: 'Valittu ratkaisu ei siirry toteutukseen pelkkänä nimenä. Käy nämä läpi ennen luovutusta — kolme ensimmäistä ovat ne, jotka yleensä unohtuvat ja löytyvät vasta toteutuksessa.' }));
  const HO = [
    ['variantit', 'Muunnelmat: miltä ratkaisu näyttää eri tilanteissa ja eri käyttäjille'],
    ['reuna', 'Reunatapaukset: mitä tapahtuu kun tieto puuttuu, verkko katkeaa tai käyttäjä tekee odottamattoman'],
    ['vuoro', 'Vuorovaikutus: mitä tapahtuu kun jotain painetaan, ja mitä käyttäjä näkee sen jälkeen'],
    ['mittarit', 'Mittarit: mistä luvusta kuukauden päästä nähdään, toimiko tämä'],
    ['testi', 'Pienen mittakaavan testi on tehty tai sovittu']
  ];
  S.final.handoff = S.final.handoff || {};
  const hl = el('div', { class: 'items' });
  HO.forEach(([k, t]) => {

    cb.addEventListener('change', () => { S.final.handoff[k] = cb.checked; save(); render(); });
    hl.append(el('label', { class: 'item', for: 'ho' + k,
      style: 'cursor:pointer;display:flex;gap:11px;align-items:flex-start' },
      [cb, el('span', { text: t })]));
  });

  const hdone = HO.filter(([k]) => S.final.handoff[k]).length;
  if (hdone < 3) m.append(el('div', { class: 'note warn' }, [
    el('b', { text: `${HO.length - hdone}/${HO.length} luovutuskohtaa on vielä avoinna` }),
    el('p', { text: 'Nämä eivät ole muodollisuuksia. Reunatapaukset ja muunnelmat ovat se osa, joka puuttuessaan löytyy vasta toteutuksessa — ja silloin se maksaa moninkertaisesti.' })
  ]));

  m.append(el('hr', { class: 'hr' }));
  m.append(loopPanel());

  m.append(el('div', { class: 'nav' }, [
    el('button', { class: 'btn', text: '← Takaisin suppilointiin', on: { click: () => { S.stage = 5; render(); } } }),
    el('button', { class: 'btn pri', text: 'Tulosta tai tallenna PDF', on: { click: () => window.print() } })
  ]));
}

function openLoop(target, defReason) {
  $('dlgBody').innerHTML = `
    <h3>Palaa vaiheeseen: ${esc(stageName(target))}</h3>
    <p style="font-size:.92rem;color:var(--ink-2)">Prosessi ei ole yksisuuntainen — Design Councilin oma periaate on "iterate, iterate, iterate". Paluu kirjataan, jotta myöhemmin näkyy mikä muuttui ja miksi.</p>
    <label class="f"><span>Miksi palaat?</span>
      <textarea id="loopWhy" rows="3" placeholder="Mikä ei kestänyt tarkastelua?">${esc(defReason || '')}</textarea></label>
    <label class="f" style="display:flex;gap:9px;align-items:center">
      <input type="checkbox" id="loopNew" style="width:auto"> <span style="margin:0">Aloita uusi kierros (kierrosnumero kasvaa)</span></label>
    <p style="display:flex;gap:10px;flex-wrap:wrap">
      <button class="btn pri" id="loopGo">Palaa</button>
      <button class="btn" onclick="document.getElementById('dlg').close()">Peruuta</button>
    </p>`;
  $('dlg').showModal();
  $('loopGo').onclick = () => {
    const why = $('loopWhy').value.trim();
    const uusi = $('loopNew').checked;
    if (!why) { toast('Kirjoita lyhyt syy.'); return; }
    if (uusi) S.round++;
    if (target <= 3) S.brief.locked = false;
    S.loops.push({
      id: uid(), from: S.stage, to: target, why,
      round: S.round, uusi, ts: new Date().toISOString()
    });
    S.stage = target;
    $('dlg').close(); save(); render();
    toast(uusi ? `Kierros ${S.round} alkoi.` : 'Palattu.');
  };
}

function loopPanel() {
  const box = el('div', {});
  box.append(el('h3', { style: 'margin:0 0 6px;font-size:1.1rem', text: 'Palaa ja pyöräytä uusi kierros' }));
  box.append(el('p', { style: 'font-size:.9rem;color:var(--ink-2)', text: 'Mikä tahansa vaihe voidaan tehdä uudestaan. Jos toimeksiantoon palataan, sen lukitus avautuu — tavoitteen muuttaminen kesken toisen timantin on tietoinen teko, ei hiljainen siirtymä.' }));
  const row = el('div', { class: 'chips', style: 'margin-top:10px' });
  STAGES.forEach(st => row.append(el('button', {
    class: 'btn sm', text: '⟲ ' + st.title.split(' —')[0],
    on: { click: () => openLoop(st.id) }
  })));
  box.append(row);

  if (S.loops.length) {
    box.append(el('h4', { style: 'margin:20px 0 7px;font-size:.92rem', text: 'Mitä on jo pyöräytetty' }));
    const l = el('div', { class: 'loops' });
    [...S.loops].reverse().forEach(x => {
      const d = new Date(x.ts);
      l.append(el('div', { class: 'loop' }, [
        el('time', { text: d.toLocaleString('fi-FI', { dateStyle: 'short', timeStyle: 'short' }) + ` · kierros ${x.round}` }),
        el('div', { text: `${stageName(x.from)} → ${stageName(x.to)}` }),
        el('div', { style: 'color:var(--ink-2);margin-top:3px', text: x.why })
      ]));
    });
    box.append(l);
  }
  return box;
}

/* Vienti kahta reittiä. Tavallisessa selaimessa — eli kun tiedosto on omalla
   koneella tai oppimisalustalla — riittää latauslinkki. Julkaistussa
   artifactissa sivu ei saa tallentaa tiedostoa itse, vaan tallennus kulkee
   downloads-oikeuden kautta ja katsoja vahvistaa sen. Ilman tätä haaraa
   "Vie" olisi artifactissa nappi joka ei tee mitään. */
async function exportJSON() {
  const name = 'kaksoistimantti-' + new Date().toISOString().slice(0, 10) + '.json';
  const data = JSON.stringify(S, null, 1);

  if (window.claude && typeof window.claude.use === 'function') {
    let dl = null;
    try { dl = await window.claude.use('downloads'); } catch (e) { dl = null; }
    if (dl) {
      try {
        await dl.save({ filename: name, data });
        toast('Työ viety tiedostoon.');
      } catch (e) {
        const c = e && e.code;
        if (c === 'declined') toast('Tallennus peruttiin.');
        else if (c === 'rate_limited') toast('Odota hetki ja yritä uudelleen.');
        else toast('Tallennus ei onnistunut tässä näkymässä.');
      }
      return;
    }
  }

  const blob = new Blob([data], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  toast('Työ viety tiedostoon.');
}

function importJSON(file) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o !== 'object' || !('finds' in o)) throw new Error('ei kelvollinen');
      if (!confirm('Tuonti korvaa nykyisen työn tässä selaimessa. Jatketaanko?')) return;
      S = Object.assign(structuredClone(BLANK), o);
      for (const k of ['input', 'brief', 'final']) S[k] = Object.assign(structuredClone(BLANK[k]), S[k] || {});
      save(); render(); toast('Työ tuotu.');
    } catch (e) { toast('Tiedostoa ei voitu lukea.'); }
  };
  r.readAsText(file);
}

/* ═══ MENETELMÄSELITE ══════════════════════════════════════════════════════ */

function helpDialog() {
  dialog(`
    <h3>Mihin tämä työkalu nojaa</h3>
    <p><strong>Runko: Double Diamond.</strong> Design Councilin malli, jossa on neljä vaihetta — Discover, Define, Develop, Deliver — ja kaksi timanttia: ensimmäinen tutkii ongelmaa, toinen ratkaisua. Molemmissa ensin laajennetaan, sitten kavennetaan. Design Council kuvaa sen tavaksi esittää minkä tahansa muotoilu- ja innovaatiohankkeen askeleet <em>riippumatta käytetyistä menetelmistä ja työkaluista</em> — malli ei siis kerro mitä tehdään, vaan missä järjestyksessä laajennetaan ja kavennetaan.</p>
    <p>Design Council korostaa itse, ettei prosessi ole suoraviivainen: opittu voi viedä takaisin timanttityön alkuun, hyvin varhaisten ideoiden testaaminen voi kuulua jo Discover-vaiheeseen, eikä digitaalisessa maailmassa yksikään idea ole koskaan "valmis". Siksi tässä työkalussa jokaiseen vaiheeseen voi palata, paluu kirjataan, ja kierrosnumero kulkee mukana.</p>
    <p>IDEOn Tim Brown on luonnehtinut mallia Design Councilin sivulla kutsuksi osallistua, ei käyttöohjeeksi. Se kannattaa pitää mielessä myös tämän työkalun kohdalla: portit ja huomautukset ovat tukia, eivät sääntöjä.</p>
    <p><strong>Mitä kustakin vaiheesta jää käteen.</strong> Discover tuottaa jäsentämätöntä aineistoa. Define tiivistää sen oivalluksiksi ja kriteereiksi — toisin sanoen rikastetuksi toimeksiannoksi. Develop tuottaa joukon keskenään erilaisia ratkaisuja. Deliver kaventaa ne yhteen tai muutamaan, testaa pienessä mittakaavassa ja luovuttaa. Jokaisen vaiheen tuotos on seuraavan syöte, ja tässä työkalussa se siirtyy automaattisesti.</p>
    <p><strong>Suppilointi: Ulrich &amp; Eppinger.</strong> Karl Ulrichin ja Steven Eppingerin <em>Product Design and Development</em> jakaa valinnan kahteen vaiheeseen. <em>Seulonta</em> (concept screening) on karkea: jokainen vaihtoehto verrataan yhteen vertailukonseptiin plus–nolla–miinus-asteikolla, ja nettopisteet karsivat heikot. <em>Pisteytys</em> (concept scoring) on tarkempi: kriteerit painotetaan ja jokainen vaihtoehto arvioidaan 1–5, jolloin saadaan painotettu summa.</p>
    <p>Menetelmän kuusi askelta ovat: valmistele matriisi, arvioi, järjestä, <strong>yhdistä ja paranna</strong>, valitse, ja pohdi prosessia. Neljäs askel jää käytännössä useimmiten tekemättä, vaikka Ulrich ja Eppinger pitävät sitä olennaisena: tavoite ei ole valita parasta konseptia vaan kehittää paras konsepti.</p>
    <h3 style="margin-top:20px">Mitä menetelmästä on syytä ajatella</h3>
    <p>Painotettu pistesumma näyttää mittaustulokselta, vaikka se on kasa arvioita kerrottuna kasalla arvioita. Kaksi lukua voi erota toisistaan sadasosilla, ja ero voi kadota heti kun painotuksia muuttaa hieman. Ulrich ja Eppinger sanovat tämän itse: tuloksen herkkyys painotuksille on tarkistettava. Tämä työkalu tekee sen automaattisesti ja kertoo, kuinka usein voittaja vaihtuu — koska pelkkä varoitus ei saa ketään tarkistamaan mitään.</p>
    <p>Toinen varaus on sama, jonka tekijät esittävät: menetelmä suosii keskimäärin hyvää vaihtoehtoa, joka ei ole kenellekään erityisen hyvä. Jos käyttäjäryhmät eroavat toisistaan, kannattaa ajaa pisteytys erikseen kullekin ja verrata.</p>
    <p>Kolmas: vertailukonseptin valinta määrää seulonnan tuloksen. Vaihda se ja katso, muuttuuko järjestys. Jos muuttuu paljon, matriisi kertoo vertailukohdasta eikä ratkaisuista.</p>
    <p><strong>Menetelmä ei tee päätöstä.</strong> Mattson &amp; Sorensen sanoo sen suoraan (s. 286): matriisi ei tee päätöstä, se antaa tietoa päätöksen tueksi. Menetelmän arvo on siinä, että erimielisyys tulee näkyviin kriteeri kerrallaan sen sijaan että se jäisi kytemään — ei siinä luvussa, joka lopussa tulostuu.</p>
    <p>Kannattaa huomata, kuka kritiikin esittää. Stuart Pugh, jonka menetelmästä seulonta on peräisin, kritisoi nimenomaan pisteytyksen kaltaisia määrällisiä menetelmiä: luvut voivat olla harhaanjohtavia ja viedä huomion pois luovuudesta, jota parempien konseptien kehittäminen vaatii (Ulrich &amp; Eppinger, s. 162). Myös Gustafsson (s. 49) varoittaa, että mitä yksityiskohtaisemmaksi Double Diamond rakennetaan, sitä hauraammaksi se käy — mikä koskee myös tätä työkalua.</p>
    <h3 style="margin-top:20px">Lähteet</h3>
    <ul style="font-size:.88rem;line-height:1.6;padding-left:20px">
      <li>Design Council: <em>The Double Diamond</em> ja <em>Framework for Innovation</em> (designcouncil.org.uk) — prosessin runko.</li>
      <li>Ulrich, K. T. &amp; Eppinger, S. D.: <em>Product Design and Development</em>, 6. painos, McGraw-Hill 2016 — menetelmä. Suppilointi on luvusta 8 (s. 145–163), sen varaukset sivuilta 159–161.</li>
      <li>Mattson, C. A. &amp; Sorensen, C. D.: <em>Product Development — Principles and Tools for Creating Desirable and Transferable Designs</em>, Springer 2020 — työkaluhakemisto, 69 menetelmää. Seulonta- ja pisteytysmatriisi s. 286–289.</li>
      <li>Gustafsson, D.: <em>Analysing the Double Diamond design process through research &amp; implementation</em>, maisterityö, Aalto-yliopisto 2019 — kriittinen tarkastelu oikeasta projektista.</li>
      <li>Käytännön vaihejaossa on hyödynnetty myös Design Bootcampin artikkelia Double Diamond -mallin soveltamisesta.</li>
    </ul>
    <p style="font-size:.86rem">Jokaiseen vaiheeseen on liitetty täsmälliset sivuviitteet. Ne löytyvät vaiheen syventävästä paneelista ja kootusti Lähteet-välilehdeltä.</p>`);
}

/* ═══ RENDERÖINTI ══════════════════════════════════════════════════════════ */

function render() {
  /* Kyselyn aikana merikortti korvaa timanttikartan: kaavio näytetään vasta
     kun tieto on siirretty siihen — silloin täyttyneet solmut ovat se luukku,
     joka aukeaa viimeisenä. */
  const mp = $('map');
  if (mp) mp.hidden = S.stage === 'kysely';
  const kb = $('bKys');
  if (kb) kb.classList.toggle('on', S.stage === 'kysely');
  const sb = $('bSyva');
  if (sb) { sb.classList.toggle('on', !!S.syva); sb.setAttribute('aria-pressed', S.syva ? 'true' : 'false'); }
  renderMap();
  refreshers = [];
  gateRefresh = null;
  const m = $('main');
  m.replaceChildren();

  if (S.stage === 'poyta') {
    m.append(spineBar());
    const c = el('section', { class: 'stage' }, [
      el('div', { class: 'eyebrow ew', text: 'PÖYTÄKIERROS' }),
      el('h2', { text: 'Paperin kautta takaisin' }),
      el('p', { class: 'lede', text: 'Tilanneraportti tulostetaan, merkitään pöydässä käsin, kuvataan ja puretaan takaisin sovellukseen. Näin toisten pöydissä puhuttu tieto kulkee mukaan, vaikka laitteet eivät näe toisiaan.' })
    ]);
    m.append(c);
    viewPoyta(c);
    return;
  }

  if (S.stage === 'kysely') { viewKysely(m); return; }

  if (S.stage === 'lahteet') {
    m.append(spineBar());
    const c = el('section', { class: 'stage' }, [
      el('div', { class: 'eyebrow ew', text: 'LÄHTEET' }),
      el('h2', { text: 'Mihin tämä työkalu nojaa' }),
      el('p', { class: 'lede', text: 'Kolme teosta, jotka kulkevat mukana vaihe vaiheelta sivunumeroineen. Menetelmä, työkalut ja kritiikki.' })
    ]);
    m.append(c);
    viewLahteet(c);
    return;
  }

  if (S.stage === 'ses') {
    m.append(spineBar());
    const c = el('section', { class: 'stage' }, [
      el('div', { class: 'eyebrow ew', text: 'VERTAISOPPIMINEN' }),
      el('h2', { text: 'Sessiot ja niiden kulku' }),
      el('p', { class: 'lede', text: 'Viisi sessiota, jotka jaksottavat prosessin luokkatilaan. Kukin kiinnittyy siihen vaiheeseen, jonka työtä se koettelee.' })
    ]);
    m.append(c);
    viewSessions(c);
    return;
  }

  m.append(spineBar());

  const st = stageOf(S.stage);
  const card = el('section', { class: 'stage' + (st.spine ? ' anchor' : '') });
  card.append(
    el('div', { class: 'eyebrow ' + st.cls, text: st.eye }),
    el('h2', { text: st.title }),
    el('p', { class: 'lede', text: st.lede }),
    (typeof ketjuBlock === 'function' ? ketjuBlock(S.stage) : null),
    deepPanel(st)
  );
  m.append(card);

  ({ 0: viewInput, 1: viewDiscover, 2: viewDefine, 3: viewBrief,
     4: viewDevelop, 5: viewDeliver, 6: viewSummary })[S.stage](card);

  /* Vertaissessiot tulevat vaiheen työn jälkeen: ensin tehdään, sitten
     koetellaan yhdessä. */
  const ses = sessionsFor(S.stage);
  if (ses) m.append(ses);

  if (S.stage > 0) {
    card.append(el('div', { style: 'margin-top:20px;padding-top:14px;border-top:1px solid var(--line)' }, [
      el('button', {
        class: 'btn sm', text: '⟲ Palaa aiempaan vaiheeseen',
        on: { click: () => openLoop(Math.max(0, S.stage - 1)) }
      })
    ]));
  }
}

function viewSessions(m) {
  m.append(sessionPlan());
  m.append(el('hr', { class: 'hr' }));
  SESSIOT.forEach(x => {
    const w = el('div', { style: 'margin:0 0 10px' });
    w.append(sessionCard(x));
    m.append(w);
  });
  m.append(el('div', { class: 'nav' }, [
    el('button', { class: 'btn', text: '← Takaisin työhön',
      on: { click: () => { S.stage = typeof S.palaa === 'number' ? S.palaa : 0; render(); } } }),
    el('button', { class: 'btn', text: 'Pöytäkierros →', on: { click: () => { S.stage = 'poyta'; render(); } } })
  ]));
}

function initTheme() {
  let t = null;
  try { t = localStorage.getItem('kt_theme'); } catch (e) {}
  if (t) document.documentElement.setAttribute('data-theme', t);
  $('bTheme').addEventListener('click', () => {
    const cur = document.documentElement.getAttribute('data-theme');
    const next = cur === 'dark' ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    try { localStorage.setItem('kt_theme', next); } catch (e) {}
  });
}

function init() {
  initTheme();
  if (load()) mark('Työ palautettu selaimesta'); else mark('Uusi työ');
  /* Tyhjä työ alkaa aloituskyselystä, ellei sitä ole ohitettu. */
  const tyhja = !S.input.idea.trim() && !S.finds.length && !S.concepts.length;
  if (tyhja && !(S.kysely && (S.kysely.ohitettu || S.kysely.valmis)) && typeof S.stage === 'number' && S.stage === 0)
    S.stage = 'kysely';
  $('bHelp').addEventListener('click', helpDialog);
  $('bKys').addEventListener('click', () => {
    if (typeof S.stage === 'number') S.palaa = S.stage;
    S.stage = 'kysely'; render();
  });
  $('bSyva').addEventListener('click', () => {
    S.syva = !S.syva; save(); render();
    toast(S.syva ? 'Syvempi kehys päällä.' : 'Syvempi kehys pois — työkalu pitäytyy perusteissa.');
  });
  $('bLah').addEventListener('click', () => {
    if (typeof S.stage === 'number') S.palaa = S.stage;
    S.stage = 'lahteet'; render();
  });
  $('bSes').addEventListener('click', () => {
    if (typeof S.stage === 'number') S.palaa = S.stage;
    S.stage = 'ses'; render();
  });
  $('bPoyta').addEventListener('click', () => {
    if (typeof S.stage === 'number') S.palaa = S.stage;
    S.stage = 'poyta'; render();
  });
  $('bExp').addEventListener('click', exportJSON);
  $('bImp').addEventListener('click', () => $('fileIn').click());
  $('peerFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (f) peerLoad(f, peerCb || (() => render()));
  });
  $('kuvaFile').addEventListener('change', e => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    S.poyta = S.poyta || { nimi: '', ohjaaja: '', kuvat: [], purku: '' };
    if (f) kuvaLisaa(f, kuvaCb || S.poyta);
  });
  $('fileIn').addEventListener('change', e => {
    if (e.target.files && e.target.files[0]) importJSON(e.target.files[0]);
    e.target.value = '';
  });
  render();
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init);
else init();

/* testejä varten */
window.KT = {
  state: () => S, set: o => { S = Object.assign(S, o); render(); },
  reset: () => { S = structuredClone(BLANK); render(); },
  render, screenNet, scoreTotal, similar, wsum, stages: STAGES,
  lahteet: LAHTEET, teokset: TEOKSET, ketju: KETJU, syva: SYVA,
  purku: PURKU, kestavyys: KESTAVYYS, mallit: MALLIT,
  satamat: SATAMAT, luovinnat: LUOVINNAT, reitti, nykyinen: () => nykyinen(),
  kysely: () => K(), kayttoon: kyselyKayttoon, laskeudu: laskeutumisVaihe, lasti, tuuli,
  sessiot: SESSIOT, timer: () => T, tstop: tStop,
  raportti: raporttiHTML, kuva: kuvaGet
};

<script id="dd-transfer-bundle">
'use strict';
(function(root){
const ID=/^(DD-[A-F0-9]{16}|[A-ZÅÄÖ]{2,3}-[0-9]{4,6}(?:-[A-Z0-9])?)$/u;
const validId=s=>typeof s==='string'&&ID.test(s);
function generate(cryptoApi=root.crypto){const bytes=new Uint8Array(8);cryptoApi.getRandomValues(bytes);return 'DD-'+Array.from(bytes,b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();}
function safeTree(x,depth=0){if(depth>18)throw Error('Tiedoston rakenne on liian syvä');if(x&&typeof x==='object'){for(const k of Object.keys(x)){if(['__proto__','constructor','prototype'].includes(k))throw Error('Kielletty kenttä');safeTree(x[k],depth+1);}}}
const str=(s,n=20000)=>typeof s==='string'?s.slice(0,n):'';
const arr=x=>Array.isArray(x)?x:[];
const itemId=(x,i,prefix)=>{const s=typeof x==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(x)&&!['__proto__','constructor','prototype'].includes(x)?x:prefix+i;return s;};
function list(x,fn){if(arr(x).length>300)throw Error('Liikaa rivejä');const out=arr(x).map(fn);if(new Set(out.map(x=>x.id)).size!==out.length)throw Error('Päällekkäiset rivitunnisteet');return out;}
function normalize(input,fallback){if(!input||typeof input!=='object'||Array.isArray(input))throw Error('Virheellinen työtiedosto');safeTree(input);if(input.formatVersion!==undefined&&input.formatVersion!==1)throw Error('Tuntematon tiedostoversio');if(input.v!==undefined&&input.v!==1)throw Error('Tuntematon Kaksoistimantti-versio');
 if(!Array.isArray(input.finds)&&!input.phases)throw Error('Tiedosto ei ole Kaksoistimantin työtiedosto');
 const studentId=input.studentId||input.sessionId||fallback;if(!validId(studentId))throw Error('Työtunnus puuttuu tai on virheellinen');
 const phases=input.phases||{},source=input.input||{idea:phases.define?.problemStatement||'',kenelle:''};
 const finds=list(input.finds|| (phases.discover?.notes?[{t:phases.discover.notes}]:[]),(x,i)=>({id:itemId(x.id,i,'f'),t:str(x.t),met:str(x.met,100)||'Havainnointi',laji:str(x.laji,50)||'havainto',teema:str(x.teema,100),round:1}));
 const insights=list(input.insights,(x,i)=>({id:itemId(x.id,i,'i'),t:str(x.t),teema:str(x.teema,100),round:1}));
 const criteria=list(input.criteria,(x,i)=>({id:itemId(x.id,i,'k'),t:str(x.t),from:insights.some(a=>a.id===x.from)?x.from:null,round:1}));
