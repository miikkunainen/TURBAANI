<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Kaksoistimantti</title>
<style>
/* ───────────────────────────────────────────────────────────────────────────
   KAKSOISTIMANTTI — muotoiluprosessin työkalu
   Rakenne: Design Councilin Double Diamond (Discover · Define · Develop ·
   Deliver). Suppilointi: Ulrich & Eppingerin concept screening ja scoring.
   Ei verkkoyhteyttä, ei ulkoisia kirjastoja. Työ tallentuu selaimeen.
   ─────────────────────────────────────────────────────────────────────────── */
:root{
  --bg:#f6f5f3; --card:#fff; --ink:#15161a; --ink-2:#55575f; --ink-3:#83858d;
  --line:#e2e0dc; --line-2:#efedea;
  --d1:#1f6f8b;        /* ensimmäinen timantti */
  --d2:#9c4f2e;        /* toinen timantti */
  --waist:#6b4b8a;     /* toimeksianto */
  --ok:#17795a; --warn:#9a6a00; --bad:#a3271f;
  --focus:#0b63c5;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 8px 24px rgba(0,0,0,.06);
  --r:12px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#131417; --card:#1b1d21; --ink:#f0eeea; --ink-2:#b2b4bb; --ink-3:#8b8d95;
    --line:#2e3137; --line-2:#24262b;
    --d1:#5fb3d0; --d2:#e0916a; --waist:#b08fd0;
    --ok:#4cc49b; --warn:#e0b050; --bad:#e8796f; --focus:#6ba8f5;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#131417; --card:#1b1d21; --ink:#f0eeea; --ink-2:#b2b4bb; --ink-3:#8b8d95;
  --line:#2e3137; --line-2:#24262b;
  --d1:#5fb3d0; --d2:#e0916a; --waist:#b08fd0;
  --ok:#4cc49b; --warn:#e0b050; --bad:#e8796f; --focus:#6ba8f5;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
h1,h2,h3,h4{line-height:1.25;margin:0}
p{margin:0 0 .8em}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1140px;margin:0 auto;padding:0 20px 80px}

/* ── ylätunniste ─────────────────────────────────────────────────────────── */
header.top{position:sticky;top:0;z-index:40;background:var(--bg);
  border-bottom:1px solid var(--line)}
.top-in{max-width:1140px;margin:0 auto;padding:12px 20px;
  display:flex;align-items:center;gap:6px 7px;flex-wrap:wrap}
.top-in .logo{margin-right:10px}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:-.01em}
.logo svg{flex:0 0 auto}
.top-sp{flex:1 1 auto;min-width:0}
.tbtn{background:none;border:1px solid var(--line);border-radius:999px;
  padding:6px 12px;cursor:pointer;font-size:.84rem;min-height:38px;white-space:nowrap}
@media (max-width:1320px){.save{display:none}}
.tbtn:hover{border-color:var(--ink-3)}
.tbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.save{font-size:.78rem;color:var(--ink-3);white-space:nowrap}

/* ── timanttikartta ──────────────────────────────────────────────────────── */
.map{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:18px 20px 12px;margin:20px 0 24px;box-shadow:var(--shadow)}
.map svg{display:block;width:100%;height:auto}
.map-foot{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;
  font-size:.78rem;color:var(--ink-2)}
.map-foot b{color:var(--ink)}
.dd-step{cursor:pointer}
.dd-step:focus-visible{outline:3px solid var(--focus)}
.dd-label{font-size:11px;font-weight:700;letter-spacing:.04em;fill:var(--ink-2)}
.dd-label.cur{fill:var(--ink)}
.dd-sub{font-size:9.5px;fill:var(--ink-3)}
.dd-count{font-size:10px;font-weight:700;fill:var(--ink-3)}
.dd-spine{font-size:9px;font-weight:800;letter-spacing:.12em}
.dd-spine.cur{font-size:9.5px}
.dd-loop{cursor:pointer}
.dd-loop:focus-visible{outline:3px solid var(--focus)}
.dd-loop:hover path{opacity:.95}
.dd-loop:hover .dd-loopt{fill:var(--waist)}
.dd-loopt{font-size:10px;font-weight:600;fill:var(--ink-3)}

/* ── kolme kiintopistettä ────────────────────────────────────────────────
   INPUT · TOIMEKSIANTO · OUTPUT ovat ne kohdat, jotka on tiedettävä koko
   ajan. Muut vaiheet ovat työskentelyä niiden välissä. */
.spine{display:flex;align-items:stretch;gap:8px;margin:0 0 18px;flex-wrap:wrap}
.spine-i{flex:1 1 170px;text-align:left;background:var(--card);border:1px solid var(--line);
  border-radius:10px;padding:11px 14px;cursor:pointer;min-height:56px}
.spine-i b{display:block;font-size:.74rem;font-weight:800;letter-spacing:.09em;
  color:var(--ink-3)}
.spine-i small{display:block;font-size:.85rem;color:var(--ink-2);margin-top:2px;line-height:1.35}
.spine-i:hover{border-color:var(--ink-3)}
.spine-i.done b{color:var(--waist)}
.spine-i.mid{border-style:dashed}
.spine-i.cur{border-color:var(--waist);border-width:2px;
  background:color-mix(in srgb,var(--waist) 7%,var(--card))}
.spine-i.cur b{color:var(--waist)}
.spine-i.cur small{color:var(--ink)}
.spine-ar{align-self:center;color:var(--ink-3);font-size:1.05rem;flex:0 0 auto}

.stage.anchor{border-color:var(--waist);border-width:2px}

.pairlab{font-size:.72rem;font-weight:800;letter-spacing:.11em;color:var(--ink-3);
  margin:18px 0 6px}
.pairlab.out{color:var(--waist);margin-top:26px}
.items.outbox .item{border-color:var(--waist);border-width:2px;
  background:color-mix(in srgb,var(--waist) 5%,var(--card))}

/* ── vaiheen kortti ──────────────────────────────────────────────────────── */
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  padding:26px;box-shadow:var(--shadow)}
.eyebrow{font-size:.72rem;font-weight:800;letter-spacing:.11em;text-transform:uppercase;
  margin-bottom:7px}
.e1{color:var(--d1)} .e2{color:var(--d2)} .ew{color:var(--waist)}
.stage h2{font-size:1.72rem;letter-spacing:-.02em;margin-bottom:8px}
.lede{color:var(--ink-2);max-width:62ch;margin-bottom:18px}

/* syventävä paneeli */
.deep{border:1px solid var(--line);border-radius:10px;margin:0 0 22px;overflow:hidden}
.deep>summary{padding:12px 16px;cursor:pointer;font-weight:600;font-size:.9rem;
  background:var(--line-2);list-style:none;display:flex;justify-content:space-between;gap:10px}
.deep>summary::-webkit-details-marker{display:none}
.deep>summary::after{content:"+";font-weight:700;color:var(--ink-3)}
.deep[open]>summary::after{content:"−"}
.deep-in{padding:16px}
.deep-in h4{font-size:.88rem;margin:14px 0 5px}
.deep-in h4:first-child{margin-top:0}
.deep-in p,.deep-in li{font-size:.9rem;line-height:1.6}
.deep-in ul{margin:4px 0;padding-left:20px}
.deep-out{border-left:3px solid var(--waist);padding-left:12px;margin-left:1px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 2px}
.chip{border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:.78rem;
  color:var(--ink-2);background:var(--bg)}

/* ── lomakkeet ───────────────────────────────────────────────────────────── */
label.f{display:block;margin:0 0 14px}
label.f>span{display:block;font-size:.84rem;font-weight:600;margin-bottom:5px}
label.f small{display:block;font-weight:400;color:var(--ink-3);font-size:.8rem;margin-top:2px}
input[type=text],input[type=number],textarea,select{
  width:100%;font:inherit;font-size:16px;padding:10px 12px;border:1px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink)}
textarea{min-height:88px;resize:vertical;line-height:1.55}
input:focus,textarea:focus,select:focus{border-color:var(--focus);outline:none;
  box-shadow:0 0 0 3px color-mix(in srgb,var(--focus) 22%,transparent)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 180px}
.row>.narrow{flex:0 1 130px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:8px;
  padding:10px 16px;cursor:pointer;font-size:.9rem;font-weight:600;min-height:44px}
.btn:hover{border-color:var(--ink-3)}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.pri:hover{opacity:.88}
.btn.sm{padding:6px 11px;min-height:32px;font-size:.82rem;font-weight:500}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn[disabled]{opacity:.45;cursor:not-allowed}

/* ── listat ──────────────────────────────────────────────────────────────── */
.items{display:grid;gap:10px;margin:16px 0}
.item{border:1px solid var(--line);border-radius:10px;padding:13px 15px;background:var(--card)}
.item-top{display:flex;gap:10px;align-items:flex-start;justify-content:space-between}
.item-txt{flex:1;min-width:0;line-height:1.5}
.item-meta{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:.73rem;padding:2px 9px;border-radius:999px;border:1px solid var(--line);
  color:var(--ink-2);background:var(--bg);white-space:nowrap}
.tag.k-fakta{border-color:color-mix(in srgb,var(--ok) 45%,var(--line));color:var(--ok)}
.tag.k-havainto{border-color:color-mix(in srgb,var(--d1) 45%,var(--line));color:var(--d1)}
.tag.k-mielipide{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));color:var(--warn)}
.tag.k-oletus{border-color:color-mix(in srgb,var(--bad) 45%,var(--line));color:var(--bad)}
.tag.k-tekoaly{border-color:color-mix(in srgb,var(--waist) 50%,var(--line));color:var(--waist);
  background:color-mix(in srgb,var(--waist) 7%,var(--bg))}
.x{background:none;border:0;color:var(--ink-3);cursor:pointer;font-size:1.1rem;
  line-height:1;padding:6px;min-width:32px;min-height:32px;border-radius:6px}
.x:hover{color:var(--bad);background:var(--line-2)}
.empty{color:var(--ink-3);font-size:.9rem;padding:18px;text-align:center;
  border:1px dashed var(--line);border-radius:10px}

/* ── huomautukset ────────────────────────────────────────────────────────── */
.note{border-left:3px solid var(--line);padding:11px 14px;margin:14px 0;
  font-size:.89rem;line-height:1.6;border-radius:0 8px 8px 0;background:var(--line-2)}
.note.ok{border-left-color:var(--ok)}
.note.warn{border-left-color:var(--warn)}
.note.bad{border-left-color:var(--bad)}
.note b{display:block;margin-bottom:3px}
.note p:last-child{margin-bottom:0}

/* ── portti ──────────────────────────────────────────────────────────────── */
.gate{margin-top:24px;border-top:1px solid var(--line);padding-top:18px}
.gate h4{font-size:.85rem;margin-bottom:9px}
.gate ul{list-style:none;padding:0;margin:0 0 14px;display:grid;gap:5px}
.gate li{font-size:.87rem;display:flex;gap:9px;align-items:flex-start;color:var(--ink-2)}
.gate li.done{color:var(--ink)}
.gate .mark{flex:0 0 18px;font-weight:700;color:var(--ink-3)}
.gate li.done .mark{color:var(--ok)}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:space-between;margin-top:6px}

/* ── taulukot ────────────────────────────────────────────────────────────── */
.tw{overflow-x:auto;margin:16px 0;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.87rem;min-width:520px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line-2);
  vertical-align:middle}
th{background:var(--line-2);font-size:.76rem;text-transform:uppercase;
  letter-spacing:.04em;color:var(--ink-2);font-weight:700;white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
td.num,th.num{text-align:center;font-variant-numeric:tabular-nums;white-space:nowrap}
/* Kriteerien otsikot saavat rivittyä: katkaisu kesken sanan näytti rikkinäiseltä. */
th.crit{white-space:normal;max-width:132px;min-width:92px;line-height:1.3}
tr.ref td{background:color-mix(in srgb,var(--waist) 9%,transparent)}
tr.out td{opacity:.5}
tr.win td{background:color-mix(in srgb,var(--ok) 11%,transparent)}
.pugh{display:flex;gap:3px;justify-content:center}
.pugh button{width:30px;height:30px;border:1px solid var(--line);background:var(--card);
  border-radius:6px;cursor:pointer;font-weight:700;font-size:.85rem;padding:0;line-height:1}
.pugh button.on[data-v="1"]{background:var(--ok);color:#fff;border-color:var(--ok)}
.pugh button.on[data-v="0"]{background:var(--ink-3);color:#fff;border-color:var(--ink-3)}
.pugh button.on[data-v="-1"]{background:var(--bad);color:#fff;border-color:var(--bad)}
.rate{width:58px;text-align:center;padding:6px}
.wt{width:74px;text-align:center;padding:6px}

/* ── herkkyys ────────────────────────────────────────────────────────────── */
.sens{border:1px solid var(--line);border-radius:10px;padding:18px;margin:18px 0}
.bars{display:grid;gap:7px;margin:14px 0}
.bar{display:grid;grid-template-columns:minmax(90px,1.4fr) 1fr 54px;gap:11px;
  align-items:center;font-size:.85rem}
.bar-t{height:22px;background:var(--line-2);border-radius:5px;overflow:hidden}
.bar-f{height:100%;background:var(--d2);border-radius:5px}
.bar-n{text-align:right;font-variant-numeric:tabular-nums;color:var(--ink-2)}
.verdict{font-size:1.02rem;font-weight:600;margin:12px 0 4px}

/* ── kierrokset ──────────────────────────────────────────────────────────── */
.loops{display:grid;gap:8px;margin:14px 0}
.loop{border:1px solid var(--line);border-left:3px solid var(--waist);
  border-radius:0 8px 8px 0;padding:11px 14px;font-size:.87rem}
.loop time{color:var(--ink-3);font-size:.8rem;display:block}

/* ── toimeksianto ────────────────────────────────────────────────────────── */
.brief{border:2px solid var(--waist);border-radius:var(--r);padding:22px;margin:18px 0;
  background:color-mix(in srgb,var(--waist) 5%,var(--card))}
.brief h3{color:var(--waist);font-size:1.3rem;margin-bottom:12px}
.brief .hmw{font-size:1.22rem;font-weight:600;line-height:1.4;margin:0 0 16px}
.brief dl{margin:0;display:grid;gap:13px}
.brief dt{font-size:.76rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
  color:var(--ink-3);margin-bottom:3px}
.brief dd{margin:0;line-height:1.55}
.brief ul{margin:3px 0;padding-left:20px}
.locked{display:inline-block;font-size:.76rem;padding:3px 11px;border-radius:999px;
  background:var(--waist);color:#fff;font-weight:700;margin-left:8px;vertical-align:middle}

/* ── yleistä ─────────────────────────────────────────────────────────────── */
.from{font-size:.8rem;color:var(--ink-3);margin:-8px 0 14px;font-style:italic}
.hr{border:0;border-top:1px solid var(--line);margin:24px 0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:90;
  background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:999px;
  font-size:.88rem;box-shadow:var(--shadow);opacity:0;pointer-events:none;
  transition:opacity .2s;max-width:90vw}
.toast.on{opacity:1}
.sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
  clip:rect(0,0,0,0);white-space:nowrap;border:0}
dialog{border:1px solid var(--line);border-radius:var(--r);padding:0;max-width:min(640px,94vw);
  background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg-in{padding:24px}
.dlg-in h3{margin-bottom:12px}
.dlg-in p,.dlg-in li{font-size:.92rem;line-height:1.62}


/* ── VERTAISOPPIMINEN ───────────────────────────────────────────────────── */
.ses-wrap{margin:26px 0 0;border-top:2px solid var(--waist);padding-top:18px}
.ses-lab{display:flex;align-items:baseline;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.ses-lab span{font-size:.72rem;font-weight:800;letter-spacing:.11em;color:var(--waist)}
.ses-lab small{font-size:.82rem;color:var(--ink-3)}
.ses{border:1px solid var(--line);border-radius:10px;background:var(--card);
  overflow:hidden;margin:0 0 10px}
.ses.on{border-color:var(--waist)}
.ses-head{display:flex;align-items:center;gap:13px;width:100%;padding:14px 16px;
  background:none;border:0;font:inherit;text-align:left;cursor:pointer;color:var(--ink);min-height:56px}
.ses-head:hover{background:var(--line-2)}
.ses-badge{flex:0 0 auto;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;
  background:var(--line-2);color:var(--ink-3);font-weight:700;font-size:.9rem}
.ses-badge.done{background:var(--ok);color:#fff}
.ses-t{flex:1;min-width:0}
.ses-t strong{display:block;font-size:1rem}
.ses-t small{display:block;font-size:.84rem;color:var(--ink-2);margin-top:1px}
.ses-chev{flex:0 0 auto;font-size:1.3rem;color:var(--ink-3);line-height:1}
.ses-body{padding:4px 16px 18px}
.ses-why{font-size:.92rem;line-height:1.6;color:var(--ink-2);margin:0 0 14px}

.tmr-bar{display:flex;align-items:center;gap:13px;flex-wrap:wrap;
  background:var(--line-2);border-radius:10px;padding:11px 14px;margin:0 0 14px}
.tmr{font-variant-numeric:tabular-nums;font-size:1.75rem;font-weight:700;letter-spacing:-.02em;
  min-width:86px;line-height:1}
.tmr.run{color:var(--waist)}
.tmr.done{color:var(--bad)}
.tmr-tot{font-size:.82rem;color:var(--ink-3)}

.ses-steps{margin:0 0 14px;padding-left:20px}
.ses-steps li{margin:0 0 11px;padding:9px 11px;border-radius:8px;border:1px solid transparent}
.ses-steps li.cur{border-color:var(--waist);background:color-mix(in srgb,var(--waist) 7%,transparent)}
.step-top{display:flex;align-items:center;justify-content:space-between;gap:11px;flex-wrap:wrap}
.ses-steps p{margin:4px 0 0;font-size:.89rem;color:var(--ink-2);line-height:1.55}
.ses-q{margin:0 0 6px;padding-left:20px}
.ses-q li{margin:5px 0;font-size:.92rem;line-height:1.55}
.ses-done{display:flex;gap:10px;align-items:center;margin-top:16px;font-size:.92rem;
  padding-top:14px;border-top:1px solid var(--line)}

.peer{border:1px solid var(--waist);border-radius:10px;padding:15px 17px;margin:16px 0;
  background:color-mix(in srgb,var(--waist) 5%,var(--card))}
.peer-top{display:flex;justify-content:space-between;align-items:center;gap:11px;flex-wrap:wrap}
.peer-h{font-weight:700;margin:0 0 6px;font-size:.95rem;color:var(--waist)}
.peer-hmw{font-size:1.05rem;font-weight:600;line-height:1.4;margin:6px 0 12px}
.peer dl{margin:0;display:grid;gap:9px}
.peer dt{font-size:.72rem;font-weight:800;letter-spacing:.07em;text-transform:uppercase;color:var(--ink-3)}
.peer dd{margin:0;font-size:.9rem;line-height:1.5}
.peer-meta{font-size:.84rem;color:var(--ink-3);margin:11px 0 0}

/* ── PÖYTÄKIERROS ───────────────────────────────────────────────────────── */
.kier{display:flex;gap:15px;align-items:flex-start;padding:18px 0;
  border-top:1px solid var(--line)}
.kier:first-of-type{border-top:0;padding-top:4px}
.kier-n{flex:0 0 auto;width:30px;height:30px;border-radius:50%;background:var(--waist);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:.92rem}
.kier h4{font-size:1rem;margin:2px 0 6px}
.kier p{font-size:.91rem;line-height:1.6;color:var(--ink-2);margin:0 0 11px}
.kier>div:last-child{flex:1;min-width:0}

.kuvat{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px;margin:14px 0 0}
.kuva{margin:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card)}
.kuva img{display:block;width:100%;height:150px;object-fit:cover;background:var(--line-2)}
.kuva figcaption{display:flex;justify-content:space-between;align-items:center;gap:7px;
  padding:7px 10px;font-size:.76rem;color:var(--ink-3)}


/* ── LÄHTEET ────────────────────────────────────────────────────────────── */

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   KAKSOISTIMANTTI
   Runko: Design Council — Discover · Define · Develop · Deliver.
   Suppilointi: Ulrich & Eppinger — concept screening ja concept scoring.

   Työkalun idea on, ettei mitään kirjoiteta kahdesti: löydöksistä jäsennetään
   oivallukset, oivalluksista kriteerit, kriteereistä tulee toimeksianto, ja
   samat kriteerit ovat ne joilla ratkaisut lopulta arvioidaan. Jos ketju
   katkeaa jossain, se näkyy — eli työkalu kertoo mistä kukin asia on peräisin.
   ═══════════════════════════════════════════════════════════════════════════ */

const KEY = 'kaksoistimantti_v1';
const uid = () => Math.random().toString(36).slice(2, 10);
const $ = id => document.getElementById(id);

const BLANK = {
  v: 1,
  stage: 0,
  round: 1,
  input: { idea: '', kenelle: '', miksinyt: '', oletukset: '' },
  finds: [],          /* Discover */
  insights: [],       /* Define */
  criteria: [],       /* Define → toimeksianto → arviointi */
  brief: { hmw: '', mukana: '', ulkopuolella: '', mittarit: '', locked: false },
  concepts: [],       /* Develop */
  screen: {},         /* {conceptId: {criterionId: -1|0|1}} */
  screenRef: null,
  screenOut: {},      /* {conceptId: true} = pudotettu */
  weights: {},        /* {criterionId: number} */
  score: {},          /* {conceptId: {criterionId: 1..5}} */
  scoreRef: null,
  final: { picked: [], miksi: '', handoff: {} },
  loops: [],
  peer: {},
  openSes: null,
  palaa: 0,
  rc: {},
  syva: false,
  kysely: {},
  kyselyTehtava: '',
  poyta: { nimi: '', ohjaaja: '', kuvat: [], purku: '' },
  seen: {}
};

let S = structuredClone(BLANK);

/* ── tallennus ───────────────────────────────────────────────────────────── */

let saveT = null;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => {
    try {
      localStorage.setItem(KEY, JSON.stringify(S));
      mark('Tallennettu selaimeen');
    } catch (e) {
      mark('Tallennus ei onnistu — vie työsi tiedostoon', true);
    }
  }, 400);
}
/* Viimeinen muutos ei saa jäädä viiveen varaan, jos välilehti suljetaan. */
function saveNow() {
  if (!saveT) return;
  clearTimeout(saveT); saveT = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
function mark(t, bad) {
  const n = $('save');
  if (!n) return;
  n.textContent = (bad ? '⚠ ' : '✓ ') + t;
  n.style.color = bad ? 'var(--bad)' : '';
}
function load() {
  try {
    const raw = localStorage.getItem(KEY);
    if (!raw) return false;
    const o = JSON.parse(raw);
    if (!o || typeof o !== 'object') return false;
    S = Object.assign(structuredClone(BLANK), o);
    for (const k of ['input', 'brief', 'final']) S[k] = Object.assign(structuredClone(BLANK[k]), S[k] || {});
    return true;
  } catch (e) { return false; }
}

function el(tag, o, kids) {
  const n = document.createElement(tag);
  if (o) for (const [k, v] of Object.entries(o)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'on') for (const [e2, f] of Object.entries(v)) n.addEventListener(e2, f);
    else if (v !== null && v !== false && v !== undefined) n.setAttribute(k, v === true ? '' : v);
  }
  if (kids) for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}
function toast(t) {
  const n = $('toast');
  n.textContent = t; n.classList.add('on');
  clearTimeout(n._t); n._t = setTimeout(() => n.classList.remove('on'), 2600);
}
function dialog(html) {
  $('dlgBody').innerHTML = html +
    '<p style="margin-top:18px"><button class="btn" onclick="document.getElementById(\'dlg\').close()">Sulje</button></p>';
  $('dlg').showModal();
}
const esc = s => String(s ?? '').replace(/[&<>"']/g, m =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m]));

/* ═══ TIETOPOHJA — Double Diamondin syvätasot ════════════════════════════════
   Jokaisesta vaiheesta kerrotaan neljä asiaa: mitä tässä tehdään, millä
   menetelmillä, miltä kelvollinen tuotos näyttää, ja mikä menee tyypillisesti
   pieleen. Viimeinen on se, joka puuttuu useimmista prosessikaavioista.
   ═══════════════════════════════════════════════════════════════════════════ */

const STAGES = [
  {
    id: 0, key: 'input', dia: 'w', eye: 'INPUT · ALOITUS', cls: 'ew', spine: 'INPUT',
    spineSub: 'Haaste tunnistettu',
    title: 'Aloitus — tämän haluamme ratkaista',
    lede: 'Jokin ei toimi, ja se on huomattu. Kirjaa haaste niin kuin se nyt näyttäytyy — keskeneräisenä ja omin sanoin. Tärkein kenttä on viimeinen: mitä oletat todeksi tarkistamatta. Juuri niitä lähdetään koettelemaan.',
    deep: {
      mita: 'Aloitus ei ole vielä toimeksianto. Se on tunnistettu haaste ja arvaus siitä, mikä ongelma on — "tässä on jotain korjattavaa ja lähdetään kehittämään". Double Diamondin koko ensimmäinen timantti on olemassa siksi, että tämä arvaus on yleensä osittain väärä.',
      miksi: 'Design Councilin ensimmäinen periaate on "put people first" — aloita ihmisten tarpeista. Lähtökohta kirjataan siksi, että siihen voidaan palata ja nähdä, mikä muuttui.',
      menetelmat: ['Oletusten listaus', 'Sidosryhmäkartta', 'Viisi kertaa miksi'],
      hyva: 'Hyvin tunnistettu haaste on niin konkreettinen, että joku voi olla siitä eri mieltä. "Parannetaan opiskelijoiden hyvinvointia" ei ole; "ensimmäisen vuoden opiskelijat eivät löydä pajavuoroja" on.',
      tuotos: 'Tunnistettu haaste ja lista oletuksista, jotka on tarkoitus koetella.',

      pieleen: 'Haaste kirjoitetaan jo ratkaisuna ("tehdään sovellus"). Silloin ensimmäinen timantti kutistuu sen sovelluksen perusteluksi, ja koko tutkimusvaihe menee hukkaan.'
    }
  },
  {
    id: 1, key: 'discover', dia: 1, eye: 'TIMANTTI 1 · LAAJENEE', cls: 'e1',
    title: 'Discover — hae tietoa',
    lede: 'Tässä kerätään, ei päätetä. Tavoite on löytää asioita, joita et tiennyt — erityisesti sellaisia, jotka ovat ristiriidassa lähtöoletustesi kanssa.',
    deep: {
      mita: 'Design Council: "Understand the actual problem rather than assume it, by spending time with the people affected." Tämä on prosessin ainoa vaihe, jossa tiedon määrän kuuluu kasvaa hallitsemattomasti.',
      miksi: 'Divergenssi on työtä, ei odottelua. Jos löydöksiä kertyy viisi ja ne kaikki tukevat lähtökohtaa, et ole laajentanut vaan kerännyt todistusaineistoa. Design Council huomauttaa myös, että hyvin varhaisten ideoiden testaaminen voi kuulua tähän vaiheeseen — vaiheet eivät ole vesitiiviitä.',
      menetelmat: ['Käyttäjähaastattelu', 'Sidosryhmähaastattelu', 'Havainnointi', 'Varjostus', 'Käytettävyystesti', 'Kysely', 'Kilpailija-analyysi', 'Kirjallisuus ja raportit', 'Avoin data', 'Organisaation oma aineisto', 'Päiväkirjat'],
      hyva: 'Vähintään kaksi eri menetelmää, koska yksi menetelmä tuottaa yhdenlaista tietoa. Haastattelu kertoo mitä ihmiset sanovat tekevänsä, havainnointi mitä he tekevät — ja ne eroavat.',
      tuotos: 'Jäsentämätön aineisto: muistiinpanot, haastattelut, mittaukset, lähteet. Design Councilin sanoin vaihe kuvaa prosessia menetelmistä riippumatta — tärkeää on mitä kertyi, ei millä työkalulla.',
      siirto: 'Kun aineistoa on tarpeeksi jäsennettäväksi teemoiksi, ja eri menetelmät ovat tuottaneet toisistaan poikkeavaa tietoa.',
      pieleen: 'Kerätään vain vahvistusta. Jos jokainen löydös on "kyllä, tämä on ongelma", tutkimus on kysynyt johdattelevia kysymyksiä. Merkitse löydösten laji rehellisesti: oletus ei ole fakta siksi, että se on kirjattu ylös.'
    }
  },
  {
    id: 2, key: 'define', dia: 1, eye: 'TIMANTTI 1 · SUPPENEE', cls: 'e1',
    title: 'Define — jäsennä tieto',
    lede: 'Ryhmittele löydökset teemoiksi ja kirjoita jokaisesta teemasta yksi oivallus. Oivalluksista johdetaan kriteerit, joilla ratkaisut myöhemmin arvioidaan.',
    deep: {
      mita: 'Design Council: "Use the insights from discovery to frame the challenge in a new way." Konvergenssi ei ole karsimista vaan tulkintaa: samat löydökset voi jäsentää usealla tavalla, ja jäsennys ratkaisee mitä ratkaistaan.',

function counts() {
  return {
    0: S.input.idea.trim() ? 1 : 0,
    1: S.finds.length,
    2: S.insights.length,
    3: S.brief.hmw.trim() ? 1 : 0,
    4: S.concepts.length,
    5: S.final.picked.length,
    6: S.final.picked.length && S.final.miksi.trim() ? S.final.picked.length : 0
  };
}

  m.querySelectorAll('[data-go]').forEach(g => {
    const go = () => { S.stage = +g.dataset.go; render(); };
    g.addEventListener('click', go);
    g.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });
  });
  const lp = m.querySelector('[data-loop]');
  if (lp) {
    const go = () => openLoop(0);
    lp.addEventListener('click', go);
    lp.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); go(); } });

/* ── kiintopistepalkki ─────────────────────────────────────────────────────
   Kolme kohtaa, jotka opiskelijan on tiedettävä koko ajan: mitä meillä on

   työskentelyä näiden välissä.                                              */

function spineBar() {
  const pts = STAGES.filter(st => st.spine);
  const bar = el('div', { class: 'spine' });
  pts.forEach((st, i) => {
    const done = counts()[st.id] > 0;
    const cur = S.stage === st.id;
    const between = !cur && S.stage > st.id && S.stage < (pts[i + 1] ? pts[i + 1].id : 99);
    bar.append(el('button', {
      class: 'spine-i' + (cur ? ' cur' : '') + (done ? ' done' : '') + (between ? ' mid' : ''),
      type: 'button',
      on: { click: () => { S.stage = st.id; render(); } }
    }, [
      el('b', { text: st.spine }),
      el('small', { text: st.spineSub })
    ]));
    if (pts[i + 1]) bar.append(el('span', { class: 'spine-ar', 'aria-hidden': 'true', text: '→' }));
  });
  return bar;
}

/* ── portti ──────────────────────────────────────────────────────────────── */

/* Portti ja huomautukset lasketaan uudelleen joka näppäinpainalluksella, ei
   vain uudelleenpiirron yhteydessä. Ilman tätä nappi pysyy harmaana vaikka
   kentät täyttyvät, ja käyttäjä luulee ettei eteneminen ole mahdollista.
   Koko näkymää ei piirretä uudelleen, koska se veisi kohdistuksen kentästä
   kesken kirjoittamisen. */
let gateRefresh = null;
let refreshers = [];

function live(fn) {
  const box = el('div', {});
  const paint = () => { box.replaceChildren(); const n = fn(); if (n) box.append(n); };
  paint();
  refreshers.push(paint);
  return box;
}
function refreshAll() {
  refreshers.forEach(f => { try { f(); } catch (e) {} });
  if (gateRefresh) gateRefresh();
}

function gate(checksFn, onNext, nextLabel) {
  const compute = () => (typeof checksFn === 'function' ? checksFn() : checksFn);
  let checks = compute();
  const list = el('ul', {});
  const box = el('div', { class: 'gate' }, [
    el('h4', { text: 'Ennen kuin jatkat' }), list
  ]);
  const paintList = () => {
    list.replaceChildren(...checks.map(c => el('li', { class: c.ok ? 'done' : '' }, [
      el('span', { class: 'mark', text: c.ok ? '✓' : '○' }),
      el('span', { text: c.t })
    ])));
  };
  paintList();
  const allOk = checks.every(c => c.ok);
  const nav = el('div', { class: 'nav' });
  if (S.stage > 0) nav.append(el('button', {
    class: 'btn', text: '← ' + stageName(S.stage - 1),
    on: { click: () => { S.stage--; render(); } }
  }));
  else nav.append(el('span'));
  if (onNext !== false) {
    const b = el('button', {
      class: 'btn pri', text: nextLabel || 'Seuraava vaihe →',
      disabled: !allOk || null,
      title: allOk ? '' : 'Täytä yllä olevat kohdat ensin',
      on: { click: () => { if (onNext) onNext(); else { S.stage++; render(); } } }
    });
    nav.append(b);
    gateRefresh = () => {
      checks = compute();
      paintList();
      const o = checks.every(c => c.ok);
      b.disabled = !o;
      b.title = o ? '' : 'Täytä yllä olevat kohdat ensin';
    };
  } else gateRefresh = () => { checks = compute(); paintList(); };
  box.append(nav);
  return box;
}

function textField(labelText, hint, value, onInput, rows) {
  const l = el('label', { class: 'f' }, [
    el('span', {}, [document.createTextNode(labelText),
      hint ? el('small', { text: hint }) : null])
  ]);
  const t = el('textarea', { rows: String(rows || 3) });
  t.value = value || '';
  t.addEventListener('input', () => { onInput(t.value); save(); refreshAll(); });
  l.append(t);
  return l;
}

/* ═══ VAIHE 0 — LÄHTÖKOHTA ═════════════════════════════════════════════════ */

function viewInput(m) {
  m.append(
    textField('Tunnistettu haaste tai idea', 'Keskeneräinen kelpaa. Kirjoita se kuten selittäisit kollegalle.',
      S.input.idea, v => { S.input.idea = v; renderMap(); }, 4),
    el('div', { class: 'two' }, [
      textField('Kenelle', 'Keitä tämä koskee? Mitä konkreettisempi, sen parempi.',
        S.input.kenelle, v => S.input.kenelle = v),
      textField('Miksi nyt', 'Mikä teki tästä ajankohtaisen juuri nyt?',
        S.input.miksinyt, v => S.input.miksinyt = v)
    ]),
    textField('Mitä oletat todeksi tarkistamatta',
      'Yksi per rivi. Nämä ovat ensimmäisen timantin tärkein kohde — niitä lähdetään koettelemaan.',
      S.input.oletukset, v => { S.input.oletukset = v; renderMap(); }, 4)
  );

  m.append(live(() => {
    const ol = oletukset();
    if (!ol.length) return null;
    return el('div', { class: 'note' }, [
      el('b', { text: `${ol.length} oletusta kirjattu` }),
      el('p', { text: 'Discover-vaiheessa näet nämä vieressä ja voit merkitä löydöksen koettelemaan tiettyä oletusta. Oletus, jota mikään löydös ei koettele, on edelleen pelkkä oletus kun toimeksiantoa kirjoitetaan.' })
    ]);
  }));

  m.append(live(() => {
    if (!/(sovellus|appi|nettisivu|järjestelm|alusta|tekoäly|chatbot|sivusto)/i.test(S.input.idea)
        || S.input.idea.trim().length <= 20) return null;
    return el('div', { class: 'note warn' }, [
      el('b', { text: 'Haaste saattaa olla jo kirjoitettu ratkaisuna' }),
      el('p', { text: 'Tekstissä mainitaan toteutustapa. Jos aloitus on "tehdään sovellus", ensimmäinen timantti kutistuu sen sovelluksen perusteluksi. Kokeile kirjoittaa sama ilman mainintaa toteutustavasta — mikä on se ongelma, jota sovellus ratkaisisi?' })
    ]);
  }));

  m.append(gate(() => [
    { t: 'Haaste on kirjoitettu', ok: S.input.idea.trim().length > 15 },
    { t: 'Vähintään yksi oletus kirjattu', ok: oletukset().length >= 1 }
  ], null, 'Aloita laajentaminen →'));
}

const oletukset = () => S.input.oletukset.split('\n').map(s => s.trim()).filter(Boolean);

/* ═══ VAIHE 1 — DISCOVER ═══════════════════════════════════════════════════ */

function viewDiscover(m) {
  const ol = oletukset();
  if (S.kyselyTehtava) m.append(el('div', { class: 'note' }, [
    el('b', { text: 'Ensimmäinen tehtävä aloituskyselystä' }),
    el('p', { text: S.kyselyTehtava + ' — kirjaa näkemäsi löydökseksi, menetelmäksi havainnointi.' })
  ]));

  const txt = el('textarea', { rows: '2', placeholder: 'Mitä löysit? Kirjoita yksi havainto.' });
  const met = el('select', {}, [
    el('optgroup', { label: 'Ensisijainen — itse kerätty' },
      MENETELMAT.filter(m => m[1] === 'ensi').map(m => el('option', { value: m[0], text: m[0] }))),
    el('optgroup', { label: 'Toissijainen — jonkun muun keräämä' },
      MENETELMAT.filter(m => m[1] === 'tois').map(m => el('option', { value: m[0], text: m[0] })))
  ]);
  const laji = el('select', {}, LAJIT.map(([v, l]) => el('option', { value: v, text: l })));
  const tee = el('input', { type: 'text', placeholder: 'Teema (esim. löydettävyys)' });
  const koe = el('select', {}, [el('option', { value: '', text: '— ei koettele oletusta —' })]
    .concat(ol.map((o, i) => el('option', { value: String(i), text: o.slice(0, 60) }))));

  const add = () => {
    const t = txt.value.trim();
    if (!t) { toast('Kirjoita löydös ensin.'); txt.focus(); return; }
    S.finds.push({
      id: uid(), t, met: met.value, laji: laji.value,
      teema: tee.value.trim() || 'Luokittelematon',
      koe: koe.value === '' ? null : +koe.value, round: S.round
    });
    txt.value = ''; save(); render();
    setTimeout(() => $('findTxt')?.focus(), 30);
  };
  txt.id = 'findTxt';
  txt.addEventListener('keydown', e => { if (e.key === 'Enter' && (e.metaKey || e.ctrlKey)) add(); });

  m.append(el('div', { class: 'item', style: 'border-style:dashed' }, [
    el('label', { class: 'f' }, [el('span', { text: 'Uusi löydös' }), txt]),
    el('div', { class: 'row' }, [
      el('label', { class: 'f' }, [el('span', { text: 'Menetelmä' }), met]),
      el('label', { class: 'f' }, [el('span', { text: 'Laji' }), laji]),
      el('label', { class: 'f' }, [el('span', { text: 'Teema' }), tee])
    ]),
    ol.length ? el('label', { class: 'f' }, [el('span', { text: 'Koetteleeko jotain oletusta?' }), koe]) : null,
    el('button', { class: 'btn pri', text: 'Lisää löydös', on: { click: add } })
  ]));

  /* laaduntarkistus — tämä on se kohta jossa työkalu sanoo ikävät asiat */
  if (S.finds.length >= 3) {
    const mets = new Set(S.finds.map(f => f.met));
    const ensi = S.finds.filter(f => metLaji(f.met) === 'ensi').length;
    const koet = new Set(S.finds.filter(f => f.koe !== null).map(f => f.koe));
    const oletuksia = S.finds.filter(f => f.laji === 'oletus').length;

    if (mets.size === 1) m.append(el('div', { class: 'note warn' }, [
      el('b', { text: 'Kaikki löydökset samasta menetelmästä' }),
      el('p', { text: `Kaikki ${S.finds.length} löydöstä on kerätty menetelmällä "${[...mets][0]}". Yksi menetelmä tuottaa yhdenlaista tietoa: haastattelu kertoo mitä ihmiset sanovat tekevänsä, havainnointi mitä he tekevät. Ne eroavat useammin kuin uskoisi.` })
    ]));

    if (ol.length && koet.size === 0) m.append(el('div', { class: 'note bad' }, [
      el('b', { text: 'Yksikään löydös ei koettele lähtöoletuksiasi' }),
      el('p', { text: 'Kirjasit oletuksia, mutta mikään löydös ei liity niihin. Tämä on tavallisin tapa tehdä tutkimusta, joka vahvistaa sen mitä jo uskottiin. Merkitse löydöksiin mitä oletusta ne koettelevat — tai hae tietoa, joka voisi osoittaa oletuksen vääräksi.' })
    ]));
    else if (ol.length && koet.size < ol.length) m.append(el('div', { class: 'note' }, [
      el('b', { text: `${ol.length - koet.size}/${ol.length} oletusta on yhä koettelematta` }),
      el('p', { text: 'Koettelematon oletus kulkee toimeksiantoon faktana, vaikka se ei ole sitä.' })
    ]));

    if (ensi === 0) m.append(el('div', { class: 'note bad' }, [
      el('b', { text: 'Kaikki aineisto on jonkun muun keräämää' }),
      el('p', { text: 'Toissijainen aineisto — raportit, kilpailija-analyysi, avoin data — kertoo siitä, mitä joku muu on joskus halunnut selvittää. Se ei kerro, mitä sinun käyttäjäsi tekevät. Design Councilin mukaan Discover tarkoittaa ihmisten parissa vietettyä aikaa: käy puhumassa edes kahdelle.' })
    ]));
    else if (ensi < S.finds.length / 3) m.append(el('div', { class: 'note warn' }, [
      el('b', { text: `Vain ${ensi}/${S.finds.length} löydöstä on itse kerättyä` }),
      el('p', { text: 'Toissijainen aineisto on hyvää taustaa, mutta se ei korvaa omaa havaintoa. Painopiste kannattaa kääntää.' })
    ]));

    const koneen = S.finds.filter(f => f.laji === 'tekoaly').length;
    const omat = S.finds.filter(f => f.laji === 'havainto').length;
    if (koneen && koneen >= S.finds.length / 2) m.append(el('div', { class: 'note warn' }, [
      el('b', { text: `${koneen}/${S.finds.length} löydöstä on koneen tuottamaa` }),
      el('p', { text: 'Simulaatio, elinkaarilaskelma ja data-analyysi ovat hyvää taustaa, mutta ne kuvaavat mallia eivätkä materiaalia. Mitä tapahtuu kun sahaat, taivutat tai poltat sen itse? Se tieto ei tule laskemalla.' })
    ]));
    else if (koneen && !omat) m.append(el('div', { class: 'note' }, [
      el('b', { text: 'Koneen syötettä on, omaa koestusta ei' }),
      el('p', { text: 'Yksikin fyysinen koe antaa laskelmalle vertailukohdan — ja paljastaa jos malli olettaa jotain, mikä ei pidä.' })
    ]));

    if (oletuksia > S.finds.length / 2) m.append(el('div', { class: 'note warn' }, [
      el('b', { text: 'Yli puolet löydöksistä on merkitty oletuksiksi' }),
      el('p', { text: 'Rehellinen merkintä on hyvä, mutta oletusten varaan jäsennettävä toimeksianto on arvaus. Tarkista muutama niistä ennen kuin jatkat.' })
    ]));
  }

  m.append(findList(S.finds, true));

  m.append(gate(() => [
    { t: 'Vähintään 5 löydöstä', ok: S.finds.length >= 5 },
    { t: 'Vähintään 2 eri menetelmää', ok: new Set(S.finds.map(f => f.met)).size >= 2 },
    { t: 'Vähintään yksi itse kerätty löydös', ok: S.finds.some(f => metLaji(f.met) === 'ensi') },
    { t: 'Vähintään 2 teemaa', ok: new Set(S.finds.map(f => f.teema)).size >= 2 }
  ], null, 'Jäsennä tieto →'));
}

function findList(list, canDel) {
  if (!list.length) return el('div', { class: 'empty', text: 'Ei vielä löydöksiä. Ensimmäinen on aina vaikein.' });
  const byTheme = {};
  list.forEach(f => (byTheme[f.teema] = byTheme[f.teema] || []).push(f));
  const wrap = el('div', {});
  Object.entries(byTheme).sort((a, b) => b[1].length - a[1].length).forEach(([teema, fs]) => {
    wrap.append(el('h4', { style: 'margin:18px 0 8px;font-size:.9rem', text: `${teema} · ${fs.length}` }));
    const items = el('div', { class: 'items' });
    fs.forEach(f => {
      const lj = LAJIT.find(l => l[0] === f.laji);
      items.append(el('div', { class: 'item' }, [
        el('div', { class: 'item-top' }, [
          el('div', { class: 'item-txt' }, [
            el('div', { text: f.t }),
            el('div', { class: 'item-meta' }, [
              el('span', { class: 'tag k-' + f.laji, text: lj ? lj[1] : f.laji }),
              el('span', { class: 'tag', text: f.met }),
              el('span', { class: 'tag ' + (metLaji(f.met) === 'ensi' ? 'k-fakta' : ''),
                text: metLaji(f.met) === 'ensi' ? 'ensisijainen' : 'toissijainen' }),
              f.koe !== null && oletukset()[f.koe]
                ? el('span', { class: 'tag', text: '⟲ koettelee: ' + oletukset()[f.koe].slice(0, 36) }) : null,
              f.round !== S.round ? el('span', { class: 'tag', text: 'kierros ' + f.round }) : null
            ])
          ]),
          canDel ? el('button', {
            class: 'x', text: '×', 'aria-label': 'Poista löydös',
            on: { click: () => { S.finds = S.finds.filter(x => x.id !== f.id); save(); render(); } }
          }) : null
        ])
      ]));
    });
    wrap.append(items);
  });
  return wrap;
}

/* ═══ VAIHE 2 — DEFINE ═════════════════════════════════════════════════════ */

function viewDefine(m) {
  const themes = {};
  S.finds.forEach(f => (themes[f.teema] = themes[f.teema] || []).push(f));

  m.append(el('p', { class: 'from', text: `Pohjana ${S.finds.length} löydöstä, ${Object.keys(themes).length} teemaa. Ryhmittely tuli Discover-vaiheen teemakentästä.` }));

  /* oivallukset */
  m.append(el('h3', { style: 'margin:22px 0 6px;font-size:1.1rem', text: 'Oivallukset' }));
  m.append(el('p', { style: 'font-size:.9rem;color:var(--ink-2)', text: 'Yksi oivallus per teema. Oivallus ei ole tiivistelmä vaan tulkinta: mitä tämä tarkoittaa ja mitä siitä seuraa.' }));

  const tsel = el('select', {}, Object.keys(themes).map(t =>
    el('option', { value: t, text: `${t} (${themes[t].length} löydöstä)` })));
  const itxt = el('textarea', { rows: '2', placeholder: 'Havaitsimme… joten…' });
  const addIns = () => {
    const t = itxt.value.trim();
    if (!t) { toast('Kirjoita oivallus ensin.'); return; }
    S.insights.push({ id: uid(), t, teema: tsel.value, round: S.round });
    itxt.value = ''; save(); render();
  };
  m.append(el('div', { class: 'item', style: 'border-style:dashed;margin-top:12px' }, [
    el('div', { class: 'row' }, [
      el('label', { class: 'f' }, [el('span', { text: 'Teema' }), tsel])
    ]),
    el('label', { class: 'f' }, [el('span', { text: 'Oivallus' }), itxt]),
    el('button', { class: 'btn pri', text: 'Lisää oivallus', on: { click: addIns } })
  ]));

  if (S.insights.length) {
    const items = el('div', { class: 'items' });
    S.insights.forEach(i => {
      const n = (themes[i.teema] || []).length;
      items.append(el('div', { class: 'item' }, [
        el('div', { class: 'item-top' }, [
          el('div', { class: 'item-txt' }, [
            el('div', { text: i.t }),
            el('div', { class: 'item-meta' }, [
              el('span', { class: 'tag', text: i.teema }),
              el('span', { class: 'tag', text: `${n} löydöstä` }),
              n < 2 ? el('span', { class: 'tag k-oletus', text: 'ohut pohja' }) : null
            ])
          ]),
          el('button', {
            class: 'x', text: '×', 'aria-label': 'Poista oivallus',
            on: { click: () => { S.insights = S.insights.filter(x => x.id !== i.id); save(); render(); } }
          })
        ])
      ]));
    });
    m.append(items);

    const thin = S.insights.filter(i => (themes[i.teema] || []).length < 2);
    if (thin.length) m.append(el('div', { class: 'note warn' }, [
      el('b', { text: `${thin.length} oivallusta nojaa alle kahteen löydökseen` }),
      el('p', { text: 'Yksi löydös on anekdootti. Oivallus, joka nojaa yhteen havaintoon, kantaa toimeksiantoon asti painoarvon, jota sillä ei ole.' })
    ]));
  }

  /* kriteerit */
  m.append(el('hr', { class: 'hr' }));
  m.append(el('h3', { style: 'margin:0 0 6px;font-size:1.1rem', text: 'Kriteerit' }));
  m.append(el('p', { style: 'font-size:.9rem;color:var(--ink-2)', text: 'Johda oivalluksista kriteerit. Näillä samoilla kriteereillä ratkaisut arvioidaan Deliver-vaiheessa — siksi niiden pitää erotella, ei kuvailla.' }));

  const ksel = el('select', {}, [el('option', { value: '', text: '— yleinen —' })]
    .concat(S.insights.map(i => el('option', { value: i.id, text: i.t.slice(0, 70) }))));
  const ktxt = el('input', { type: 'text', placeholder: 'esim. Löydettävissä ilman ennakkotietoa' });
  const addK = () => {
    const t = ktxt.value.trim();
    if (!t) { toast('Kirjoita kriteeri ensin.'); return; }
    S.criteria.push({ id: uid(), t, from: ksel.value || null, round: S.round });
    ktxt.value = ''; save(); render();
  };
  ktxt.addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); addK(); } });
  m.append(el('div', { class: 'item', style: 'border-style:dashed;margin-top:12px' }, [
    el('div', { class: 'row' }, [
      el('label', { class: 'f', style: 'flex:2 1 260px' }, [el('span', { text: 'Kriteeri' }), ktxt]),
      el('label', { class: 'f' }, [el('span', { text: 'Mistä oivalluksesta' }), ksel])
    ]),
    el('button', { class: 'btn pri', text: 'Lisää kriteeri', on: { click: addK } })
  ]));

  if (S.criteria.length) {
    const items = el('div', { class: 'items' });
    S.criteria.forEach(k => {
      const src = S.insights.find(i => i.id === k.from);
      items.append(el('div', { class: 'item' }, [
        el('div', { class: 'item-top' }, [
          el('div', { class: 'item-txt' }, [
            el('div', { text: k.t }),
            el('div', { class: 'item-meta' }, [
              src ? el('span', { class: 'tag', text: '← ' + src.t.slice(0, 48) })
                  : el('span', { class: 'tag k-oletus', text: 'ei kytköstä oivallukseen' })
            ])
          ]),
          el('button', {
            class: 'x', text: '×', 'aria-label': 'Poista kriteeri',
            on: { click: () => {
              S.criteria = S.criteria.filter(x => x.id !== k.id);
              delete S.weights[k.id]; save(); render();
            } }
          })
        ])
      ]));
    });
    m.append(items);

    const vague = S.criteria.filter(k => /^(helppo|hyvä|selkeä|toimiva|laadukas|moderni|kiva|nopea|tehokas|joustava)[\wäöåÄÖÅ-]*$/i.test(k.t.trim()));
    if (vague.length) m.append(el('div', { class: 'note warn' }, [
      el('b', { text: 'Kriteeri ei erottele' }),
      el('p', { text: `"${vague[0].t}" on sellainen, jonka jokainen ratkaisu voi väittää täyttävänsä. Muotoile se niin, että kaksi ratkaisua voi saada siitä eri arvion: mitä pitää tapahtua, jotta se täyttyy?` })
    ]));

    const orphan = S.criteria.filter(k => !k.from).length;
    if (orphan && S.insights.length) m.append(el('div', { class: 'note' }, [
      el('b', { text: `${orphan} kriteeriä ilman kytkentää oivallukseen` }),
      el('p', { text: 'Kriteeri ilman oivallusta on mieltymys. Se voi silti olla oikea — mutta silloin se kannattaa perustella jollain muulla kuin tutkimuksella.' })
    ]));
  }

  m.append(gate(() => [
    { t: 'Vähintään 2 oivallusta', ok: S.insights.length >= 2 },
    { t: 'Vähintään 3 kriteeriä', ok: S.criteria.length >= 3 },
    { t: 'Vähintään yksi kriteeri nojaa oivallukseen', ok: S.criteria.some(k => k.from) }
  ], null, 'Kirjoita toimeksianto →'));
}

/* ═══ VAIHE 3 — TOIMEKSIANTO ═══════════════════════════════════════════════ */

function viewBrief(m) {
  m.append(el('p', { class: 'from', text: `Koottu ${S.insights.length} oivalluksesta ja ${S.criteria.length} kriteeristä, jotka syntyivät ${S.finds.length} löydöksestä.` }));

  if (S.brief.locked) {
    m.append(briefCard());
    m.append(el('div', { class: 'note ok' }, [
      el('b', { text: 'Toimeksianto on lukittu' }),
      el('p', { text: 'Kriteerit ovat nyt ne, joilla ratkaisut arvioidaan. Jos ne osoittautuvat vääriksi, avaa lukitus — se kirjataan paluuksi, jotta myöhemmin näkyy milloin ja miksi tavoite muuttui.' })
    ]));
    m.append(el('div', { class: 'nav' }, [
      el('button', {
        class: 'btn', text: 'Avaa lukitus ja palaa jäsentämään',
        on: { click: () => openLoop(2, 'Toimeksianto avattiin uudelleen') }
      }),
      el('button', { class: 'btn pri', text: 'Tuota ratkaisuja →', on: { click: () => { S.stage = 4; render(); } } })
    ]));
    return;
  }

  const hmw = el('input', { type: 'text', placeholder: 'Miten voisimme…' });
  hmw.value = S.brief.hmw;
  hmw.addEventListener('input', () => { S.brief.hmw = hmw.value; save(); renderMap(); if (gateRefresh) gateRefresh(); });

  m.append(el('label', { class: 'f' }, [
    el('span', {}, [document.createTextNode('Miten voisimme -kysymys'),
      el('small', { text: 'Niin laaja, että siihen on useita hyvin erilaisia vastauksia. Niin kapea, ettei mikä tahansa kelpaa.' })]),
    hmw
  ]));

  m.append(el('div', { class: 'two' }, [
    textField('Mikä on mukana', 'Mitä tämä toimeksianto kattaa.', S.brief.mukana, v => S.brief.mukana = v),
    textField('Mikä jää ulkopuolelle', 'Usein tärkeämpi kuin edellinen.', S.brief.ulkopuolella, v => S.brief.ulkopuolella = v)
  ]));
  m.append(textField('Mistä tiedämme onnistuneemme', 'Havaittava muutos, ei tunne.', S.brief.mittarit, v => S.brief.mittarit = v));

  m.append(el('h4', { style: 'margin:20px 0 7px;font-size:.92rem', text: 'Kriteerit, jotka siirtyvät arviointiin' }));
  m.append(el('div', { class: 'chips' }, S.criteria.map(k => el('span', { class: 'chip', text: k.t }))));

  if (S.brief.hmw.trim() && !/\?$/.test(S.brief.hmw.trim())) m.append(el('div', { class: 'note' }, [
    el('p', { text: 'Pieni asia: kysymys ilman kysymysmerkkiä luetaan usein väitteenä.' })
  ]));

  m.append(gate(() => [
    { t: 'Miten voisimme -kysymys on kirjoitettu', ok: S.brief.hmw.trim().length > 12 },
    { t: 'Rajaus ulkopuolelle on kirjoitettu', ok: S.brief.ulkopuolella.trim().length > 5 },
    { t: 'Onnistumisen mittari on kirjoitettu', ok: S.brief.mittarit.trim().length > 5 },
    { t: 'Vähintään 3 kriteeriä', ok: S.criteria.length >= 3 }
  ], () => {
    S.brief.locked = true;
    if (S.criteria.every(k => S.weights[k.id] === undefined)) evenWeights(S.criteria.map(k => k.id));
    else S.criteria.forEach(k => { if (S.weights[k.id] === undefined) S.weights[k.id] = 0; });
    normWeights();
    save(); render(); toast('Toimeksianto lukittu.');
  }, 'Lukitse toimeksianto →'));
}

function briefCard() {
  const d = el('dl');
  const add = (t, v) => { d.append(el('dt', { text: t }), el('dd', { text: v || '—' })); };
  add('Mukana', S.brief.mukana);
  add('Ulkopuolella', S.brief.ulkopuolella);
  add('Onnistuminen', S.brief.mittarit);
  d.append(el('dt', { text: 'Kriteerit' }),

          ]),

              delete S.screen[c.id]; delete S.score[c.id]; delete S.screenOut[c.id];
              if (S.screenRef === c.id) S.screenRef = null;
              if (S.scoreRef === c.id) S.scoreRef = null;
              S.final.picked = S.final.picked.filter(p => p !== c.id);
              save(); render();
            } }
          })
        ])
      ]));

  } else {

  }

  if (S.concepts.length >= 2 && similar(S.concepts)) m.append(el('div', { class: 'note warn' }, [
    el('b', { text: 'Ratkaisut muistuttavat toisiaan' }),
    el('p', { text: 'Kuvauksissa toistuvat samat sanat. Ulrich & Eppingerin vertailu toimii vain, jos vaihtoehdot eroavat: samankaltaisten vertailu tuottaa matriisin, jossa kaikki rivit näyttävät samalta — ja menetelmä näyttää vahvistavan valinnan, jota ei oikeasti tehty. Lisää yksi tahallaan liioiteltu vaihtoehto.' })
  ]));

  m.append(gate(() => [
    { t: 'Vähintään 3 ratkaisua', ok: S.concepts.length >= 3 },

  ], null, 'Suppiloi →'));
}

function similar(cs) {
  if (cs.length < 2) return false;
  const words = c => new Set((c.nimi + ' ' + c.kuvaus).toLowerCase()
    .replace(/[^\wäöå\s]/g, ' ').split(/\s+/).filter(w => w.length > 4));
  let pairs = 0, close = 0;
  for (let i = 0; i < cs.length; i++) for (let j = i + 1; j < cs.length; j++) {
    const a = words(cs[i]), b = words(cs[j]);
    if (a.size < 3 || b.size < 3) continue;
    const inter = [...a].filter(w => b.has(w)).length;
    pairs++;
    if (inter / Math.min(a.size, b.size) > 0.55) close++;
  }
  return pairs > 0 && close / pairs > 0.5;
}

/* ═══ VAIHE 5 — DELIVER · ULRICH & EPPINGER ════════════════════════════════
   Kaksi matriisia. Seulonta on karkea ja nopea: jokainen konsepti verrataan
   vertailukonseptiin plus–nolla–miinus. Pisteytys on tarkempi: painotetut
   kriteerit ja 1–5 arviot. Väliin kuuluu U&E:n neljäs askel, yhdistäminen ja
   parantaminen, joka jää käytännössä useimmiten tekemättä.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Tasajako ei mene tasan kolmella tai kuudella kriteerillä: Math.round(100/3)
   kolmesti on 99, ja käyttäjä näkisi heti lukituksen jälkeen virheilmoituksen
   omasta työkalustaan. Jäännös jaetaan ensimmäisille kriteereille. */
function evenWeights(ids) {
  const base = Math.floor(100 / ids.length);
  let rest = 100 - base * ids.length;
  ids.forEach(i => { S.weights[i] = base + (rest-- > 0 ? 1 : 0); });
}
function normWeights() {
  const ids = S.criteria.map(k => k.id);
  if (!ids.length) return;
  const sum = ids.reduce((a, i) => a + (+S.weights[i] || 0), 0);
  if (sum === 0) evenWeights(ids);
}
const wsum = () => S.criteria.reduce((a, k) => a + (+S.weights[k.id] || 0), 0);
const alive = () => S.concepts.filter(c => !S.screenOut[c.id]);

function screenNet(cid) {
  const r = S.screen[cid] || {};
  let p = 0, mi = 0;
  S.criteria.forEach(k => { const v = r[k.id]; if (v === 1) p++; else if (v === -1) mi++; });
  return { p, mi, net: p - mi };
}
function scoreTotal(cid) {
  const r = S.score[cid] || {};
  let t = 0;
  S.criteria.forEach(k => { t += ((+S.weights[k.id] || 0) / 100) * (+r[k.id] || 3); });
  return t;
}

function renderScoreOnly() { render(); }

/* ── herkkyystarkastelu ───────────────────────────────────────────────────
   Ulrich & Eppinger sanovat itse, että tuloksen herkkyys painotuksille on
   tarkistettava. Tämä tekee sen: painotuksia häiritään satunnaisesti ja
   katsotaan, kuinka usein voittaja vaihtuu. Jos vaihtuu usein, ero ei ole
   todellinen vaan painotusten tuote — ja se on tieto, jota pelkkä
   pistesumma ei kerro.                                                      */

function sensitivity() {
  const cs = alive();
  const box = el('div', { class: 'sens' }, [
    el('h3', { style: 'font-size:1.15rem;margin-bottom:4px', text: '4. Herkkyystarkastelu' }),
    el('p', { style: 'font-size:.9rem;color:var(--ink-2)', text: 'Painotukset ovat arvioita, mutta pistesumma näyttää mittaustulokselta. Tämä ajo häiritsee painotuksia satunnaisesti ±25 % ja laskee, kuinka usein voittaja vaihtuu. Ulrich & Eppinger (s. 159) pitävät järjestyksen herkkyyden tutkimista osana menetelmää: sen avulla nähdään, vaikuttaako yksittäisen arvion epävarmuus valintaan. Samalla sivulla todetaan, että pisteytysjärjestelmän tarkkuus huomioiden pienet erot eivät yleensä ole merkitseviä.' })
  ]);
  if (cs.length < 2 || S.criteria.length < 2 || wsum() !== 100) {
    box.append(el('p', { style: 'font-size:.9rem;color:var(--ink-3)', text: 'Ajo vaatii vähintään kaksi ratkaisua, kaksi kriteeriä ja painotukset 100 %:iin.' }));
    return box;
  }

  const N = 2000, wins = {};
  cs.forEach(c => wins[c.id] = 0);
  const base = cs.map(c => ({ id: c.id, t: scoreTotal(c.id) }));
  base.sort((a, b) => b.t - a.t);
  /* Liukuluvut tuottavat tasapelissä mielivaltaisen järjestyksen. Kärjen
     nimeäminen sadasosien perusteella olisi juuri sitä valheellista tarkkuutta,
     josta tämä paneeli varoittaa — joten tasapeli sanotaan tasapeliksi. */
  const EPS = 0.005;
  const tied = base.length > 1 && Math.abs(base[0].t - base[1].t) < EPS;
  const baseWinner = tied ? null : base[0].id;
  let rng = 123456789;
  const rnd = () => { rng = (rng * 1103515245 + 12345) & 0x7fffffff; return rng / 0x7fffffff; };

  for (let n = 0; n < N; n++) {
    const w = {};
    let tot = 0;
    S.criteria.forEach(k => {
      const b = +S.weights[k.id] || 0;
      const v = Math.max(0, b * (0.75 + rnd() * 0.5));
      w[k.id] = v; tot += v;
    });
    let bestId = null, bestV = -1;
    cs.forEach(c => {
      let t = 0;
      S.criteria.forEach(k => { t += (w[k.id] / (tot || 1)) * (+(S.score[c.id] || {})[k.id] || 3); });
      if (t > bestV) { bestV = t; bestId = c.id; }
    });
    wins[bestId]++;
  }

  const rows = cs.map(c => ({ c, p: wins[c.id] / N })).sort((a, b) => b.p - a.p);
  const topP = rows[0].p;
  const bars = el('div', { class: 'bars' });
  rows.forEach(({ c, p }) => {
    bars.append(el('div', { class: 'bar' }, [
      el('span', { text: c.nimi }),
      el('div', { class: 'bar-t' }, [el('div', { class: 'bar-f', style: `width:${Math.round(p * 100)}%` })]),
      el('span', { class: 'bar-n', text: Math.round(p * 100) + ' %' })
    ]));
  });
  box.append(bars);

  const nimi = id => (S.concepts.find(c => c.id === id) || {}).nimi || '?';
  let v, cls, note;
  if (topP >= 0.8) {
    v = `Tulos on vakaa. "${nimi(rows[0].c.id)}" voittaa ${Math.round(topP * 100)} % kokeiluista.`;
    cls = 'ok';
    note = 'Painotusten kohtuullinen muuttaminen ei käännä tulosta. Ero vaihtoehtojen välillä on todellinen eikä seuraa painotusten valinnasta.';
  } else if (topP >= 0.55) {
    v = `Tulos on jokseenkin vakaa: ${Math.round(topP * 100)} %.`;
    cls = 'warn';
    note = `Voittaja kestää useimmat painotukset, mutta "${nimi(rows[1].c.id)}" nousee kärkeen ${Math.round(rows[1].p * 100)} %:ssa kokeiluista. Perustele painotukset ennen kuin nojaat eroon.`;
  } else {
    v = `Tulos ei ole vakaa: kärkivaihtoehto voittaa vain ${Math.round(topP * 100)} % kokeiluista.`;
    cls = 'bad';
    note = 'Voittaja vaihtuu, kun painotuksia muutetaan hieman. Pistesumma näyttää tarkalta, mutta ero on painotusten tuote eikä ominaisuus ratkaisuissa. Älä valitse pistesumman perusteella — palaa kriteereihin tai hanki lisätietoa, joka erottelee vaihtoehdot oikeasti.';
  }
  if (tied) {
    const kpl = base.filter(x => Math.abs(x.t - base[0].t) < EPS).length;
    note += ` Huomaa myös, että nykyisillä painotuksilla ${kpl} vaihtoehtoa saa täsmälleen saman pistesumman (${base[0].t.toFixed(2)}). Pistesumma ei siis erottele niitä lainkaan — ero syntyy vasta siitä, mitä painotuksille tehdään.`;
  } else if (rows[0].c.id !== baseWinner) {
    note += ` Huomaa myös, että nykyisillä painotuksilla kärjessä on "${nimi(baseWinner)}", mutta häirityissä ajoissa useimmin voittaa "${nimi(rows[0].c.id)}".`;
  }
  box.append(el('div', { class: 'note ' + cls }, [el('b', { class: 'verdict', text: v }), el('p', { text: note })]));
  box.append(el('p', { style: 'font-size:.82rem;color:var(--ink-3);margin:0' },
    [document.createTextNode(`${N} kokeilua, painotukset häirittynä ±25 %. Arviot pidetään ennallaan — tämä mittaa painotusten vaikutusta, ei arvioiden epävarmuutta.`)]));
  return box;
}

const sesById = id => SESSIOT.find(x => x.id === id);
const mmss = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');

/* ── ajastin ──────────────────────────────────────────────────────────────
   Yksi ajastin kerrallaan, askel kerrallaan. Ei ääntä: luokkatilassa
   yllättävä ääni keskeyttää myös ne ryhmät, joita se ei koske.             */

let T = { ses: null, step: 0, left: 0, run: false, h: null };

function tStop() { clearInterval(T.h); T.h = null; T.run = false; }
function tStart(ses, step) {
  tStop();
  T.ses = ses.id; T.step = step; T.left = ses.askeleet[step].s; T.run = true;
  T.h = setInterval(() => {
    T.left--;
    if (T.left <= 0) {
      T.left = 0; tStop();
      const n = $('tmr');
      if (n) n.classList.add('done');
      toast('Aika täynnä: ' + ses.askeleet[step].t);
    }
    paintTimer();
  }, 1000);
  paintTimer();
}
function paintTimer() {
  const n = $('tmr');
  if (!n) return;
  n.textContent = mmss(T.left);
  n.classList.toggle('run', T.run);
  const b = $('tmrBtn');
  if (b) b.textContent = T.run ? 'Tauko' : (T.left > 0 ? 'Jatka' : 'Alusta');
  document.querySelectorAll('[data-step]').forEach(r => {
    r.classList.toggle('cur', +r.dataset.step === T.step && T.ses);
  });
}

/* ── vertaisen työ vain luettavaksi ───────────────────────────────────────
   Tuotu työ EI mene S:ään eikä tallennu — se elää vain tämän sivulatauksen
   ajan. Haarukoinnin pitää olla turvallista: kenenkään ei pidä pelätä, että
   toisen työ korvaa oman.                                                   */

let PEER = null;
/* Kuuntelija kiinnitetään kerran käynnistyksessä, ei joka napinpainalluksessa:
   uudelleen kiinnitetty onchange jättää vanhan version elämään ja johtaa
   vaikeasti jäljitettäviin kaksoiskäsittelyihin. */
let peerCb = null;

function peerLoad(file, after) {
  const r = new FileReader();
  r.onload = () => {
    try {
      const o = JSON.parse(r.result);
      if (!o || typeof o !== 'object' || !('brief' in o)) throw new Error('ei kelpaa');
      PEER = o;
      toast('Vertaisen työ avattu luettavaksi. Omaa työtäsi ei muutettu.');
      if (after) after();
    } catch (e) { toast('Tiedostoa ei voitu lukea.'); }
  };
  r.readAsText(file);
}

function peerPanel(onChange) {
  const box = el('div', { class: 'peer' });
  if (!PEER) {
    box.append(
      el('p', { class: 'peer-h', text: 'Vertaisen työ rinnalle' }),
      el('p', { style: 'font-size:.88rem;color:var(--ink-2)', text: 'Pari voi viedä työnsä tiedostoon "Vie"-napilla ja lähettää sen sinulle. Tuotu työ avautuu tähän vain luettavaksi — omaa työtäsi se ei muuta eikä sitä tallenneta mihinkään.' }),
      el('button', {
        class: 'btn', text: 'Avaa vertaisen tiedosto',
        on: { click: () => { peerCb = onChange; $('peerFile').click(); } }
      })
    );
    return box;
  }
  const b = PEER.brief || {};
  const dl = el('dl');
  const add = (t, v) => dl.append(el('dt', { text: t }), el('dd', { text: v || '—' }));
  add('Mukana', b.mukana); add('Ulkopuolella', b.ulkopuolella); add('Onnistuminen', b.mittarit);
  dl.append(el('dt', { text: 'Kriteerit' }), el('dd', {}, [
    el('ul', {}, (PEER.criteria || []).map(k => el('li', { text: k.t })))
  ]));
  box.append(
    el('div', { class: 'peer-top' }, [
      el('p', { class: 'peer-h', text: 'Vertaisen työ · vain luettavissa' }),
      el('button', {
        class: 'btn sm', text: 'Sulje',
        on: { click: () => { PEER = null; if (onChange) onChange(); } }
      })
    ]),
    el('p', { class: 'peer-hmw', text: b.hmw || '— ei toimeksiantoa —' }),
    dl,
    el('p', { class: 'peer-meta', text: `${(PEER.finds || []).length} löydöstä · ${(PEER.insights || []).length} oivallusta · ${(PEER.concepts || []).length} ratkaisua` })
  );
  return box;
}

  ['moni', 'Kysymykseen on useita hyvin erilaisia vastauksia',

  ['raja', 'Rajaus kertoo mikä jää ulkopuolelle',

function haarukkaList(ses) {
  S.peer = S.peer || {};
  S.peer[ses.id] = S.peer[ses.id] || { checks: {}, puuttuu: '', muistiin: '' };
  const st = S.peer[ses.id];
  const wrap = el('div', {});
  wrap.append(el('h4', { style: 'margin:18px 0 4px;font-size:.95rem', text: 'Haarukointilista' }));
  wrap.append(el('p', { style: 'font-size:.88rem;color:var(--ink-2)', text: 'Pari käy nämä läpi ääneen ja perustelee jokaisen. Rastita se, minkä pari hyväksyi.' }));
  const list = el('div', { class: 'items' });
  HAARUKKA.forEach(([k, t, why]) => {
    const cb = el('input', { type: 'checkbox', id: 'hk' + k });
    cb.checked = !!st.checks[k];
    cb.addEventListener('change', () => { st.checks[k] = cb.checked; save(); refreshAll(); });
    list.append(el('label', { class: 'item', for: 'hk' + k,
      style: 'cursor:pointer;display:flex;gap:11px;align-items:flex-start' },
      [cb, el('span', {}, [
        el('span', { style: 'font-weight:600', text: t }),
        el('span', { style: 'display:block;font-size:.86rem;color:var(--ink-2);margin-top:2px', text: why })
      ])]));
  });
  wrap.append(list);
  wrap.append(live(() => {
    const n = HAARUKKA.filter(([k]) => st.checks[k]).length;
    if (n === HAARUKKA.length) return el('div', { class: 'note ok' }, [
      el('b', { text: 'Pari hyväksyi kaikki kohdat' }),
      el('p', { text: 'Toimeksianto kestää vieraan lukijan. Se ei takaa että se on oikea — vain että se on ymmärrettävä ja rajattu.' })
    ]);
    if (n === 0) return null;
    return el('div', { class: 'note warn' }, [
      el('b', { text: `${HAARUKKA.length - n}/${HAARUKKA.length} kohtaa jäi auki` }),
      el('p', { text: 'Avoimet kohdat ovat ne, joihin kannattaa palata ennen kuin toinen timantti aloitetaan. Korjaus maksaa tässä vähemmän kuin missään myöhemmin.' })
    ]);
  }));
  return wrap;
}

/* ── session näkymä ──────────────────────────────────────────────────────── */

function sessionCard(ses) {
  S.peer = S.peer || {};
  S.peer[ses.id] = S.peer[ses.id] || { checks: {}, puuttuu: '', muistiin: '', tehty: false };
  const st = S.peer[ses.id];
  const open = S.openSes === ses.id;

  const head = el('button', {
    class: 'ses-head' + (open ? ' on' : ''), type: 'button',
    'aria-expanded': open ? 'true' : 'false',
    on: { click: () => { S.openSes = open ? null : ses.id; tStop(); save(); render(); } }
  }, [
    el('span', { class: 'ses-badge' + (st.tehty ? ' done' : ''), text: st.tehty ? '✓' : '◷' }),
    el('span', { class: 'ses-t' }, [
      el('strong', { text: ses.nimi }),
      el('small', { text: `${ses.muoto} · noin ${ses.min} min` })
    ]),
    el('span', { class: 'ses-chev', text: open ? '−' : '+' })
  ]);

  const box = el('section', { class: 'ses' + (open ? ' on' : '') }, [head]);
  if (!open) return box;

  const body = el('div', { class: 'ses-body' });
  body.append(el('p', { class: 'ses-why', text: ses.miksi }));

  /* ajastin ja askeleet */
  const total = ses.askeleet.reduce((a, x) => a + x.s, 0);
  const bar = el('div', { class: 'tmr-bar' }, [
    el('span', { class: 'tmr', id: 'tmr', text: T.ses === ses.id ? mmss(T.left) : mmss(ses.askeleet[0].s) }),
    el('button', {
      class: 'btn sm', id: 'tmrBtn', text: 'Käynnistä',
      on: { click: () => {
        if (T.ses === ses.id && T.run) { tStop(); paintTimer(); return; }
        if (T.ses === ses.id && T.left > 0) {
          T.run = true;
          T.h = setInterval(() => {
            T.left--;
            if (T.left <= 0) { T.left = 0; tStop(); toast('Aika täynnä.'); }
            paintTimer();
          }, 1000);
          paintTimer(); return;
        }
        tStart(ses, 0);
      } }
    }),
    el('span', { class: 'tmr-tot', text: `koko sessio noin ${Math.round(total / 60)} min` })
  ]);
  body.append(bar);

  const steps = el('ol', { class: 'ses-steps' });
  ses.askeleet.forEach((a, i) => {
    steps.append(el('li', { 'data-step': String(i), class: T.ses === ses.id && T.step === i ? 'cur' : '' }, [
      el('div', { class: 'step-top' }, [
        el('strong', { text: a.t }),
        el('button', {
          class: 'btn sm', text: mmss(a.s),
          'aria-label': `Käynnistä ajastin: ${a.t}`,
          on: { click: () => { tStart(ses, i); } }
        })
      ]),
      el('p', { text: a.o })
    ]));
  });
  body.append(steps);

  body.append(el('h4', { style: 'margin:18px 0 5px;font-size:.95rem', text: 'Kysymyksiä, jotka vievät eteenpäin' }));
  body.append(el('ul', { class: 'ses-q' }, ses.kysy.map(q => el('li', { text: q }))));

  if (ses.haarukka) {
    body.append(peerPanel(() => render()));
    body.append(haarukkaList(ses));
  }

  /* kirjaus — ilman tätä keskustelu haihtuu */
  body.append(el('h4', { style: 'margin:20px 0 5px;font-size:.95rem', text: 'Mitä keskustelusta jäi käteen' }));
  const ta = el('textarea', { rows: '3', placeholder: ses.kirjaa });
  ta.value = st.muistiin || '';
  ta.addEventListener('input', () => { st.muistiin = ta.value; save(); refreshAll(); });
  body.append(el('label', { class: 'f' }, [el('span', { text: ses.kirjaa }), ta]));

  if (ses.vie) body.append(vieNappi(ses, st));

  const done = el('label', { class: 'ses-done' }, []);
  const cb = el('input', { type: 'checkbox' });
  cb.checked = !!st.tehty;
  cb.addEventListener('change', () => { st.tehty = cb.checked; save(); render(); });
  done.append(cb, el('span', { text: 'Sessio käyty' }));
  body.append(done);

  box.append(body);
  return box;
}

/* Kirjaus siirtyy suoraan työhön: vertaisen huomio ei jää irralliseksi
   muistiinpanoksi vaan muuttuu oletukseksi, löydökseksi tai ratkaisuksi. */
function vieNappi(ses, st) {
  const labels = {
    oletus: 'Lisää tämä oletuksiin',
    loydos: 'Lisää tämä löydökseksi',
    konsepti: 'Lisää tämä ratkaisuksi',
    brief: 'Avaa toimeksianto korjattavaksi'
  };
  return el('button', {
    class: 'btn', text: labels[ses.vie],
    on: { click: () => {
      const t = (st.muistiin || '').trim();
      if (!t && ses.vie !== 'brief') { toast('Kirjaa ensin mitä keskustelusta jäi käteen.'); return; }
      if (ses.vie === 'oletus') {
        S.input.oletukset = (S.input.oletukset ? S.input.oletukset + '\n' : '') + t;
        toast('Lisätty oletuksiin.'); S.stage = 0;
      } else if (ses.vie === 'loydos') {
        S.finds.push({ id: uid(), t, met: 'Työpaja', laji: 'havainto',
          teema: 'vertaisarvio', koe: null, round: S.round });
        toast('Lisätty löydöksiin.'); S.stage = 1;
      } else if (ses.vie === 'konsepti') {
        S.concepts.push({ id: uid(), nimi: t.slice(0, 40), kuvaus: t, hybrid: null, round: S.round });
        toast('Lisätty ratkaisuihin.'); S.stage = 4;
      } else {
        S.brief.locked = false; S.stage = 3;
        toast('Toimeksiannon lukitus avattu.');
      }
      save(); render();
    } }
  });
}

/* ── kuvavarasto (IndexedDB) ─────────────────────────────────────────────── */

let kuvaCb = null;
let IDB = null;
function idb() {
  if (IDB) return Promise.resolve(IDB);
  return new Promise(res => {
    try {
      const r = indexedDB.open('kaksoistimantti_kuvat', 1);
      r.onupgradeneeded = () => r.result.createObjectStore('kuvat');
      r.onsuccess = () => { IDB = r.result; res(IDB); };
      r.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function kuvaPut(id, blob) {
  const d = await idb(); if (!d) return false;
  return new Promise(res => {
    try {
      const t = d.transaction('kuvat', 'readwrite');
      t.objectStore('kuvat').put(blob, id);
      t.oncomplete = () => res(true); t.onerror = () => res(false);
    } catch (e) { res(false); }
  });
}
async function kuvaGet(id) {
  const d = await idb(); if (!d) return null;
  return new Promise(res => {
    try {
      const t = d.transaction('kuvat', 'readonly');
      const q = t.objectStore('kuvat').get(id);
      q.onsuccess = () => res(q.result || null); q.onerror = () => res(null);
    } catch (e) { res(null); }
  });
}
async function kuvaDel(id) {
  const d = await idb(); if (!d) return;
  try { d.transaction('kuvat', 'readwrite').objectStore('kuvat').delete(id); } catch (e) {}
}

/* Pienennys: täysikokoinen puhelinkuva on 3–8 Mt eikä sitä tarvita.
   1600 px riittää käsialan lukemiseen ruudulta. */
function pienennaKuva(file, maxPx = 1600, laatu = 0.75) {
  return new Promise((res, rej) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      URL.revokeObjectURL(url);
      const sc = Math.min(1, maxPx / Math.max(img.width, img.height));
      const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
      const cv = document.createElement('canvas');
      cv.width = w; cv.height = h;
      cv.getContext('2d').drawImage(img, 0, 0, w, h);
      cv.toBlob(b => b ? res(b) : rej(new Error('ei onnistunut')), 'image/jpeg', laatu);
    };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('ei kuva')); };
    img.src = url;
  });
}

function kuvaLista(P) {
  const wrap = el('div', { class: 'kuvat' });
  if (!P.kuvat.length) return wrap;
  P.kuvat.forEach(k => {
    const fig = el('figure', { class: 'kuva' });

    kuvaGet(k.id).then(b => { if (b) img.src = URL.createObjectURL(b); });
    fig.append(img, el('figcaption', {}, [
      el('span', { text: new Date(k.ts).toLocaleString('fi-FI', { dateStyle: 'short', timeStyle: 'short' }) + ` · kierros ${k.round} · ${k.kt} kt` }),
      el('button', {
        class: 'x', text: '×', 'aria-label': 'Poista kuva',
        on: { click: () => {
          kuvaDel(k.id);
          P.kuvat = P.kuvat.filter(x => x.id !== k.id);
          save(); render();
        } }
      })
    ]));
    wrap.append(fig);
  });
  return wrap;
}

/* Litteroidun puheen jäsennys: sanastoon ja rakenteeseen perustuva ehdotus
   siitä, mihin kukin rivi kuuluu. Ei ymmärrä tekstiä — ehdottaa vain, ja
   opiskelija hyväksyy rivi kerrallaan. */

/* HUOM. JavaScriptin \w on [A-Za-z0-9_] — se EI täsmää ä:hän eikä ö:hön, joten
   suomenkielinen sana jää tunnistamatta kesken. Lisäksi taivutus vaihtaa
   vartalon: olettaa → oletetaan, havaita → havaitsimme. Molemmat on
   huomioitava, tai tunnistus osuu vain siistiin perusmuotoon. */
const SW = '[0-9A-Za-zÀ-ÖØ-öø-ÿ_]*';
const fre = src => new RegExp(src.split('·').join(SW), 'i');

const PURKU = [
  { k: 'oletus', lab: 'Oletus',
    re: fre('(olet·|oletus·|luul·|usko·|varmaan|kaiketi|pitäisi olla|voisi olla|ehkä|arvaa·)') },
  { k: 'loydos', lab: 'Löydös',
    re: fre('(havait·|havaits·|huomas·|huomat·|näki·|näimme|kertoi|sanoi|mittas·|mittaus·|prosent·|osuus|[0-9]+ ?(%|kpl|kertaa|kappalet·))') },
  /* HUOM. tähän EI panna paljasta "ai"-vaihtoehtoa. fre() ei lisää sanarajoja,
     joten "ai" osuisi keskelle sanoja — suomessa vaihe, aika, aina, painotus,
     lainaus — ja lähes jokainen lause luokittuisi tekoälyksi. */
  { k: 'tekoaly', lab: 'Tekoäly',

function purkuEhdotus(P) {
  const rivit = (P.purku || '').split(/\n|(?<=[.!?])\s+/).map(x => x.trim()).filter(x => x.length > 8);
  if (!rivit.length) return null;
  const wrap = el('div', {});
  wrap.append(el('h4', { style: 'margin:16px 0 4px;font-size:.93rem', text: `${rivit.length} kohtaa tunnistettu` }));
  wrap.append(el('p', { style: 'font-size:.86rem;color:var(--ink-2)', text: 'Työkalu ei ymmärrä tekstiä — se tunnistaa sanastoa ja ehdottaa. Tarkista jokainen ja vie ne, jotka kuuluvat työhön.' }));
  const list = el('div', { class: 'items' });
  rivit.slice(0, 40).forEach((r, i) => {
    const hit = PURKU.find(p => p.re.test(r));
    const sel = el('select', {}, [el('option', { value: '', text: '— ei vietävä —' })]
      .concat(PURKU.map(p => el('option', { value: p.k, text: p.lab, selected: hit && hit.k === p.k ? true : null }))));
    list.append(el('div', { class: 'item' }, [
      el('div', { class: 'item-top' }, [
        el('div', { class: 'item-txt', text: r }),
        el('div', { style: 'display:flex;gap:7px;align-items:center;flex-wrap:wrap' }, [
          sel,
          el('button', {
            class: 'btn sm', text: 'Vie',
            on: { click: () => {
              const k = sel.value;
              if (!k) { toast('Valitse ensin mihin tämä kuuluu.'); return; }
              if (k === 'oletus') S.input.oletukset = (S.input.oletukset ? S.input.oletukset + '\n' : '') + r;
              else if (k === 'loydos') S.finds.push({ id: uid(), t: r, met: 'Työpaja', laji: 'havainto', teema: 'pöytäkierros', koe: null, round: S.round });
              else if (k === 'kriteeri') S.criteria.push({ id: uid(), t: r.slice(0, 80), from: null, round: S.round });
              else if (k === 'konsepti') S.concepts.push({ id: uid(), nimi: r.slice(0, 40), kuvaus: r, hybrid: null, round: S.round });
              else if (k === 'tekoaly') S.finds.push({ id: uid(), t: r, met: 'Lokaalin tekoälyn data-analyysi', laji: 'tekoaly', teema: 'koneen syöte', koe: null, round: S.round });
              else if (k === 'puute') S.finds.push({ id: uid(), t: 'PUUTE: ' + r, met: 'Työpaja', laji: 'oletus', teema: 'puutteet', koe: null, round: S.round });
              save(); toast('Viety työhön.'); renderMap();
            } }
          })
        ])
      ])
    ]));
  });
  wrap.append(list);
  return wrap;
}

/* ── todellisuustarkistus pudotetuille ────────────────────────────────────
   Ulrich & Eppinger (s. 159) pyytää tämän nimenomaisesti: jokaisen
   valintavaiheen jälkeen käydään läpi pudotetut, ja jos jokin niistä on
   kokonaisuutena parempi kuin jokin jäljelle jäänyt, syy on etsittävä —
   kriteeri puuttuu, on väärin painotettu tai sitä on sovellettu
   epäjohdonmukaisesti. Tämä on menetelmän oma itsekorjaus, ja se jää
   käytännössä tekemättä, koska pudotettuihin ei haluta palata.             */

function realityCheck() {
  const out = S.concepts.filter(c => S.screenOut[c.id]);
  if (!out.length) return null;
  S.rc = S.rc || {};
  const box = el('div', { class: 'rc' });
  box.append(
    el('h4', { text: 'Todellisuustarkistus — katso pudotetut vielä kerran' }),
    el('p', { text: 'Ulrich & Eppinger (s. 159) pyytää tämän jokaisen valintavaiheen jälkeen. Jos jokin pudotettu on kokonaisuutena parempi kuin jokin jäljelle jäänyt, jokin kriteeri puuttuu, on väärin painotettu tai sitä on sovellettu epäjohdonmukaisesti. Tämä on menetelmän oma itsekorjaus.' })
  );
  const list = el('div', { class: 'items' });
  out.forEach(c => {
    const cb = el('input', { type: 'checkbox', id: 'rc' + c.id });
    cb.checked = !!S.rc[c.id];
    cb.addEventListener('change', () => { S.rc[c.id] = cb.checked; save(); refreshAll(); });
    list.append(el('label', { class: 'item', for: 'rc' + c.id,
      style: 'cursor:pointer;display:flex;gap:11px;align-items:flex-start' },
      [cb, el('span', {}, [
        el('strong', { text: c.nimi }),
        el('span', { style: 'display:block;font-size:.87rem;color:var(--ink-2);margin-top:2px',
          text: 'Pudotus kestää tarkastelun — tämä ei ole parempi kuin jäljelle jääneet.' })
      ])]));
  });
  box.append(list);
  box.append(live(() => {
    const auki = out.filter(c => !S.rc[c.id]).length;
    if (!auki) return el('div', { class: 'note ok' }, [
      el('p', { text: 'Kaikki pudotukset on tarkistettu. Jos jokin niistä tuntui paremmalta kuin jäljelle jäänyt, palaa kriteereihin — älä pakota valintaa.' })
    ]);
    return el('div', { class: 'note warn' }, [
      el('p', { text: `${auki} pudotusta on tarkistamatta. Pudotettuihin ei yleensä haluta palata, ja juuri siksi tämä kohta kannattaa tehdä.` })
    ]);
  }));
  return box;
}
