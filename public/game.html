<!doctype html>
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B26">
<title>Purjehdus verkossa — Turbiini</title>
<style>
:root{
  --bg:#0F1B26;--bg2:#162A38;--kortti:#F7F3EC;--kortti2:#EEE7DA;--ink:#14212C;--ink2:#46525C;--ink3:#6B7680;
  --viiva:#DDD3C3;--d1:#237F8C;--d2:#B35E2A;--kulta:#D99A2B;--ok:#2B7A4B;--vasta:#A9561A;
  --aalto:rgba(20,33,44,.07);--sumu:#A7B3BA;--reitti:#8796A0;--focus:#3F7FCF;--r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:radial-gradient(ellipse at 50% -10%,#1E3A4C 0%,var(--bg) 55%) fixed,var(--bg);color:var(--ink);
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;padding-bottom:96px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:500;line-height:1.2;margin:0 0 10px}
h1{font-size:2.4rem}h2{font-size:1.35rem}h3{font-size:1.08rem;margin-top:18px}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
#app{max-width:1180px;margin:0 auto;padding:12px 12px 24px}
.kortti{background:var(--kortti);border-radius:var(--r);padding:18px;margin:12px 0;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.btn{background:var(--kortti2);border:1px solid var(--viiva);border-radius:999px;padding:10px 18px;min-height:44px;cursor:pointer;font-weight:600}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--ink);color:var(--kortti);border-color:var(--ink)}
.btn.pieni{padding:6px 12px;min-height:36px;font-size:.88rem}
.btn.iso{font-size:1.15rem;padding:14px 28px;min-height:56px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.rivi{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:10px 0}
.rivi input,.rivi select{flex:1 1 160px;min-width:0}
.f{display:block;margin:12px 0}
.f>span{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}
.f>small{display:block;color:var(--ink3);font-size:.82rem;margin:-2px 0 4px}
input,textarea,select{width:100%;border:1px solid var(--viiva);border-radius:10px;padding:10px 12px;background:#fff;font-size:16px}
textarea{resize:vertical}
.ohje{color:var(--ink2);margin:0 0 8px}
.pieni{font-size:.84rem;color:var(--ink3);margin:6px 0}
.huom{background:#FBEBD6;border-radius:10px;padding:10px 12px;color:#6B3A0E;font-size:.92rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:10px 0}
.ok{color:var(--ok);font-weight:600}
.v-eye{font-size:.72rem;font-weight:800;letter-spacing:.12em;color:var(--d1);margin-bottom:6px}

/* yläpalkki */
.yla{position:sticky;top:0;z-index:20;background:rgba(15,27,38,.94);backdrop-filter:blur(8px);color:#F4EFE6;
  margin:-12px -12px 0;padding:10px 14px 8px;border-bottom:1px solid #24394A}
.yla-r1{display:flex;justify-content:space-between;align-items:center;gap:10px}
.yla-v{display:flex;flex-direction:column;min-width:0}
.yla-v b{font-family:Georgia,serif;font-size:1.15rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.yla-eye{font-size:.66rem;font-weight:800;letter-spacing:.12em;color:#7FC4CC}
.yla-kello{font:700 1.9rem/1 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;color:#F4D58A}
.yla-r2{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
.chip{font-size:.78rem;font-weight:700;padding:3px 10px;border-radius:999px;background:#24394A;color:#DCE6EA}
.chip.t-myota{background:#1F5A3B;color:#D7F3E2}.chip.t-vasta{background:#6B3A12;color:#FDE3C9}
.chip.sidottu{background:#5A4A16;color:#FCEFC2}
.oma-lippu{display:inline-flex}
.yla-pr{height:4px;background:#24394A;border-radius:4px;margin-top:8px;overflow:hidden}
.yla-pr>div{height:100%;background:linear-gradient(90deg,var(--d1),var(--kulta),var(--d2))}

/* merikortti */
.kartta{background:linear-gradient(180deg,#E6EEF1,#D9E6EB);border-radius:var(--r);margin:12px 0;overflow-x:auto}
.kartta svg{display:block;width:100%;min-width:560px;height:auto}
.k-n{font-size:11px;font-weight:700;fill:var(--ink)}
.k-num{font-size:12px;font-weight:800}
.k-pieni{font-size:10px;fill:var(--ink3);font-weight:600}
.k-s{cursor:pointer}.k-s.luk{cursor:not-allowed;opacity:.65}
.vene{animation:keinu 3s ease-in-out infinite}
@keyframes keinu{50%{translate:0 -2px;rotate:-3deg}}

/* vaihe */
.vaihe h2{margin-bottom:6px}
.luovi{border-left:4px solid var(--vasta);background:#FBEFE3;border-radius:8px;padding:10px 12px;margin:12px 0}
.luovi b{color:var(--vasta)}.luovi p{margin:4px 0 0;font-size:.92rem}
.lista{margin:14px 0}
.l-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.l-r{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--viiva);border-radius:10px;padding:8px 10px;margin:6px 0}
.l-t{flex:1;min-width:0;display:flex;flex-direction:column}
.l-t small{color:var(--ink3);font-size:.78rem}
.l-r.src-kumppani{border-style:dashed}
.l-r.koe-piti{border-color:var(--ok)}.l-r.koe-kaatui{border-color:var(--vasta)}
.l-r.vaara{border-color:var(--vasta);background:#FDF3EA}
.l-r.valittu{border-color:var(--d2);box-shadow:0 0 0 2px var(--d2) inset}
.l-add{display:flex;gap:8px}
.x{border:none;background:var(--kortti2);border-radius:8px;min-width:36px;min-height:36px;font-size:1.15rem;cursor:pointer}
.tyhja{color:var(--ink3);font-size:.9rem;font-style:italic}
.koe{display:flex;gap:6px}
.teot{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.teko{text-align:left;background:#fff;border:2px solid var(--viiva);border-radius:12px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:3px;min-height:100px}
.teko b{font-family:Georgia,serif;font-size:1.05rem}.teko span{font-size:.8rem;color:var(--ink2)}
.teko .hinta{margin-top:auto;font-weight:700;color:var(--d1)}
.teko.on{border-color:var(--d1);background:#EAF4F5}
.teko-f{background:#fff;border-radius:12px;padding:12px;border:2px solid var(--d1)}
.teko-f textarea{margin:8px 0}
.jako{background:var(--kortti2);border-radius:12px;padding:12px;margin-top:16px}
.jako p{margin:4px 0;font-size:.9rem;color:var(--ink2)}
.liittolaiset{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.tahdet{display:flex;flex-direction:column;gap:6px;margin:10px 0}
.tahti{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#fff;border:1px solid var(--viiva);border-radius:10px;padding:10px;cursor:pointer}
.tahti.on{border-color:var(--kulta);background:#FFF7E6}
.t-merkki{color:var(--kulta);font-size:1.2rem;line-height:1}
.kuvio svg{display:block;width:220px;max-width:100%;margin:4px auto}
.kurssi{font-family:Georgia,serif;font-style:italic;background:var(--kortti2);padding:10px 12px;border-radius:10px}
.leima-ok{border:2px solid var(--ok);border-radius:12px;padding:12px;margin:12px 0;background:#E9F5EE}
.yhd{background:#FBF1E8;border:1px dashed var(--d2);border-radius:12px;padding:12px;margin:10px 0}
.regatta{display:flex;flex-direction:column;gap:12px;margin:12px 0}
.rg-k{background:#fff;border:1px solid var(--viiva);border-radius:12px;padding:10px}
.rg-h{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.paino{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ink2)}
.rg-r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:4px 0;border-top:1px solid #F0EAE0}
.rg-r>span{font-size:.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis}
.asteikko{display:flex;gap:4px;flex:0 0 auto}
.asteikko button{width:38px;height:38px;border-radius:8px;border:1px solid var(--viiva);background:var(--kortti);cursor:pointer;font-weight:700}
.asteikko button.on{background:var(--d2);color:#fff;border-color:var(--d2)}
.tulos{background:var(--kortti2);border-radius:12px;padding:12px}
.tr{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;padding:6px 0;border-bottom:1px solid var(--viiva)}
.tr small{width:100%;color:var(--ink3)}
.tr.voittaja b{color:var(--d2)}
.loki .lk,.tarkastelu .lk{display:grid;grid-template-columns:140px 1fr;gap:10px;padding:6px 0;border-bottom:1px solid var(--viiva);font-size:.92rem}
.lk>span{color:var(--ink3)}.lk ul{margin:0;padding-left:18px}
.sparraus{background:#EAF4F5;border-radius:10px;padding:10px 12px;margin:12px 0}
.sparraus ul{margin:4px 0 0;padding-left:18px}
.ohjeet{background:#EAF4F5;border-radius:12px;padding:12px 14px;margin:12px 0}
.ohjeet ol{margin:6px 0 0;padding-left:20px}.ohjeet li{margin:6px 0;font-size:.92rem}

/* sumu, karikot ja siirtymä */
.sumu{animation:ajelehtii 9s ease-in-out infinite alternate}
.sumu.s1{animation-duration:11s}.sumu.s2{animation-duration:13s;animation-direction:alternate-reverse}
@keyframes ajelehtii{to{transform:translateX(7px)}}
.sumu-teksti{font-style:italic;letter-spacing:.08em}
.siirtyma{display:none}
.siirtyma.on{display:block;position:fixed;inset:0;z-index:75;overflow:hidden;cursor:pointer;
  background:linear-gradient(180deg,#0E2233 0%,#24506A 52%,#E9A86A 78%,#1E4A63 79%)}
.s-sanat span{position:absolute;left:0;white-space:nowrap;font-family:Georgia,serif;font-style:italic;font-size:clamp(1rem,4vw,1.5rem);color:#FFF8EC;
  text-shadow:0 2px 12px rgba(0,0,0,.5);animation:s-pilvi 4.4s linear both}
@keyframes s-pilvi{from{transform:translateX(105vw);opacity:0}12%{opacity:.95}88%{opacity:.95}to{transform:translateX(-110%);opacity:0}}
.s-otsikko{position:absolute;left:0;right:0;top:64%;transform:translateY(-100%);text-align:center;color:#FFF8EC;padding:0 16px}
.s-eye{font-size:.72rem;font-weight:800;letter-spacing:.2em;color:#F4D58A}
.s-otsikko b{display:block;font-family:Georgia,serif;font-weight:500;font-size:clamp(1.5rem,6vw,2.6rem);margin:4px 0}
.s-otsikko p{margin:0 auto;max-width:520px;color:#F3E9DA}
.s-meri{position:absolute;left:0;right:0;bottom:0;height:22%}
.s-meri svg{width:100%;height:100%;display:block}
.s-aalto{animation:s-aalto 3.4s linear infinite}
@keyframes s-aalto{to{transform:translateX(-80px)}}
.s-satamat{position:absolute;left:0;right:0;bottom:calc(22% - 34px);display:flex;justify-content:space-between;padding:0 4%;color:#F4EFE6;font-size:.8rem;font-weight:700}
.s-vene{position:absolute;bottom:calc(22% - 30px);left:6%;width:72px;height:72px;animation:s-vene 3s cubic-bezier(.45,.05,.4,1) forwards}
.s-vene svg{width:100%;height:100%}
@keyframes s-vene{0%{left:6%;transform:rotate(0)}25%{transform:rotate(-4deg) translateY(-3px)}50%{transform:rotate(3deg)}75%{transform:rotate(-3deg) translateY(-2px)}100%{left:calc(94% - 72px);transform:rotate(0)}}
.s-ohita{position:absolute;bottom:10px;left:0;right:0;text-align:center;color:rgba(255,248,236,.7);font-size:.78rem;margin:0}
.siirtyma.vahan .s-sanat span{animation:none;position:static;display:inline-block;margin:8px}
.siirtyma.vahan .s-sanat{position:absolute;top:8%;left:0;right:0;text-align:center}
.siirtyma.vahan .s-vene{animation:none;left:calc(94% - 72px)}
.siirtyma.vahan .s-aalto,.siirtyma.vahan .sumu{animation:none}
@media (prefers-reduced-motion:reduce){.sumu{animation:none}}

/* lähtösatama ja rantautuminen */
.kohtaus{position:relative;overflow:hidden;border-radius:var(--r);margin:12px 0;color:#FFF8EC;min-height:460px;display:flex;flex-direction:column;justify-content:flex-end;padding-top:150px;box-shadow:0 14px 40px rgba(0,0,0,.35)}
.kohtaus.iso{min-height:250px;padding-top:110px}
.kohtaus.iso .pilvet{height:105px}
.kohtaus.iso h1{font-size:clamp(2rem,4vw,2.8rem)}
.kohtaus.iso .k-sis{padding:12px 18px 14px}
.k-kuva{position:absolute;inset:0}
.k-kuva svg{width:100%;height:100%;display:block}
.kohtaus::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,18,28,0) 0%,rgba(10,18,28,0) 130px,rgba(10,18,28,.55) 230px,rgba(10,18,28,.82) 100%);pointer-events:none}
.pilvet{position:absolute;left:0;right:0;top:0;height:140px;pointer-events:none;z-index:1}
.pilvi{position:absolute;left:0;white-space:nowrap;font-family:Georgia,serif;font-style:italic;font-size:1rem;color:#FFF8EC;text-shadow:0 2px 10px rgba(0,0,0,.45);animation:purjehdi linear infinite;will-change:transform}
.pilvi.iso{font-size:1.35rem}
@keyframes purjehdi{from{transform:translateX(-110%)}to{transform:translateX(110vw)}}
.k-sis{position:relative;z-index:2;padding:18px 18px 20px}
.k-eye{font-size:.72rem;font-weight:800;letter-spacing:.18em;color:#F4D58A}
.kohtaus h1{font-size:clamp(2.2rem,7vw,3.6rem);margin:4px 0 6px;color:#FFF8EC;text-shadow:0 3px 18px rgba(0,0,0,.4)}
.k-lead{margin:0 0 12px;max-width:640px;line-height:1.55;color:#F3E9DA}
.k-valmius{background:rgba(10,18,28,.55);backdrop-filter:blur(4px);border-radius:12px;padding:12px;margin:8px 0 12px;max-width:520px}
.k-v-h{display:flex;justify-content:space-between}
.k-mittari{height:8px;border-radius:8px;background:rgba(255,255,255,.18);margin:6px 0 8px;overflow:hidden}
.k-mittari>div{height:100%;background:linear-gradient(90deg,#7FC4CC,#F4D58A);transition:width .6s}
.k-valmius ul{list-style:none;margin:0;padding:0;font-size:.9rem}
.k-valmius li{display:flex;gap:8px;padding:2px 0;color:#D6CDBF}.k-valmius li.on{color:#FFF8EC}
.k-m{width:1.1em;color:#7FC4CC;font-weight:800}
.k-nappi{background:#F4D58A;color:#14212C;border-color:#F4D58A}
.k-nappi.himmea{background:rgba(255,255,255,.18);color:#FFF8EC;border-color:rgba(255,255,255,.3)}
.k-tila{font-weight:700;color:#F4D58A;margin:6px 0 0}
.k-tulos{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px;margin:6px 0 12px}
.k-t{background:rgba(10,18,28,.55);backdrop-filter:blur(4px);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.k-t span{font-size:.74rem;letter-spacing:.06em;color:#F4D58A;text-transform:uppercase;font-weight:700}
.k-t b{font-family:Georgia,serif;font-weight:500;font-size:1.02rem}
.k-liput{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.vene-lahto,.vene-ranta{transform-box:fill-box;transform-origin:center}
.vene-lahto{animation:keinu 3.4s ease-in-out infinite}
.kohtaus.lahtee .vene-lahto{animation:irtoaa 2.2s ease-in forwards}
@keyframes irtoaa{to{transform:translate(520px,10px) scale(.4);opacity:.2}}
.kohtaus.saapuu .vene-ranta{animation:saapuu 1.8s ease-out}
@keyframes saapuu{from{transform:translateX(-420px)}}
.valokeila{transform-box:fill-box;transform-origin:right center;animation:keila 6s ease-in-out infinite}
.ankkuroitu .valokeila{opacity:.7}
@keyframes keila{50%{transform:rotate(14deg)}}
@media (prefers-reduced-motion:reduce){.pilvi{animation:none;position:static;display:inline-block;margin:4px 10px}.pilvet{display:flex;flex-wrap:wrap;align-content:flex-start;padding:10px}.vene-lahto,.valokeila{animation:none}.kohtaus.lahtee .vene-lahto,.kohtaus.saapuu .vene-ranta{animation:none}}

/* merisanasto ja esimerkit */
.sana{border-bottom:2px dotted var(--d1);cursor:help;color:inherit}
.sana:hover,.sana:focus-visible{background:#EAF4F5}
.yla .sana{border-bottom-color:#7FC4CC}.yla .sana:hover{background:transparent}
.sanapop{display:none}
.sanapop.on{display:block;position:fixed;z-index:80;background:var(--kortti);color:var(--ink);border-radius:12px;padding:12px 14px;box-shadow:0 14px 40px rgba(0,0,0,.45);border-top:4px solid var(--d1)}
.sanapop b{font-family:Georgia,serif;font-size:1.1rem}.sanapop p{margin:6px 0;font-size:.9rem}
.sp-l{font-weight:700;color:var(--d1)}
.sanasto{margin:0;max-height:60vh;overflow:auto}
.sanasto dt{font-family:Georgia,serif;font-weight:600;margin-top:10px}
.sanasto dd{margin:2px 0 0;font-size:.88rem;color:var(--ink2)}
.esim{margin-top:6px;font-size:.86rem}
.esim summary{cursor:pointer;color:var(--d1);font-weight:600}
.esim ul{margin:6px 0 0;padding-left:18px}.esim li{margin:3px 0;color:var(--ink2)}
.f-l>span{display:block;font-weight:600;font-size:.92rem;margin-bottom:4px}

/* aloitus */
.alku{max-width:640px;margin:24px auto}
.alku-kuva svg{width:180px;display:block;margin:4px 0 10px}
.roolit{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.rooli{text-align:left;background:#fff;border:2px solid var(--viiva);border-radius:14px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.rooli b{font-family:Georgia,serif;font-size:1.15rem}.rooli span{font-size:.84rem;color:var(--ink2)}
.rooli:hover{border-color:var(--d1)}
.lippu-valinta{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.kirj{width:90px;text-transform:uppercase;font-weight:800;text-align:center;letter-spacing:.08em}
.varit{display:grid;grid-template-columns:repeat(12,1fr);gap:6px}
.vari{aspect-ratio:1;border-radius:50%;border:2px solid rgba(0,0,0,.15);cursor:pointer;min-width:24px;min-height:24px}
.vari.on{box-shadow:0 0 0 3px var(--kortti),0 0 0 5px var(--ink)}
.vk-lippu{display:flex;justify-content:center;margin:8px 0}

/* pelijohtaja (heijastin) */
.johto{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
.j-kello{display:flex;flex-direction:column}
.j-vaihe{font-family:Georgia,serif;font-size:2rem}
.j-aika{font:700 clamp(3.5rem,9vw,7rem)/1 system-ui,-apple-system,sans-serif;font-variant-numeric:tabular-nums;color:var(--ink);margin:4px 0}
.j-koko{font-size:1.1rem;color:var(--d1);font-weight:700}
.jana{display:flex;gap:3px;margin:16px 0}
.jn{background:var(--kortti2);border-radius:8px;padding:6px;min-width:0;display:flex;flex-direction:column;font-size:.72rem;overflow:hidden}
.jn b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.jn span{color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.jn.ohi{opacity:.5}.jn.nyt{background:var(--kulta);color:var(--ink)}.jn.nyt span{color:var(--ink)}
.ev-napit{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ev-lista{margin:8px 0 0;padding-left:18px;font-size:.88rem;color:var(--ink2)}
.j-qr{text-align:center}
.laivasto .lu-head h3{margin:0}
.satamat{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px}
.sat{background:#E6EEF1;border-radius:10px;padding:8px;min-height:120px}
.sat.nyt{background:#FFF1D2;box-shadow:0 0 0 2px var(--kulta) inset}
.sat-h{display:flex;flex-direction:column;font-size:.75rem;margin-bottom:6px}
.sat-h span{color:var(--ink3)}
.sat-l{display:flex;flex-wrap:wrap;gap:4px}
.vene-l{border-radius:6px;padding:1px}
.vene-l.sid{outline:2px dashed #8A6A1E;outline-offset:1px}
.vene-l.tupla{background:#FBD9D2}

/* QR */
.qrbox{background:#fff;border-radius:14px;padding:10px;margin:10px auto;max-width:420px}
.qrbox.iso{max-width:560px}
.qr{display:block;width:100%;height:auto;image-rendering:pixelated}
.qrtila{font-size:.84rem;color:var(--ink2);margin:6px 0 0;min-height:1.2em}
.qrteksti summary{font-size:.8rem;color:var(--ink3);cursor:pointer;margin-top:6px}
.qrteksti textarea{font:12px ui-monospace,monospace;margin-top:6px}
dialog{border:none;border-radius:var(--r);padding:0;max-width:min(520px,94vw);width:100%;background:var(--kortti);color:var(--ink)}
dialog::backdrop{background:rgba(8,15,22,.75)}
.dlg-in{padding:16px;display:flex;flex-direction:column;gap:8px}
.lu-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.lukija{display:none}
.lukija.on{display:flex;position:fixed;inset:0;z-index:60;background:rgba(8,15,22,.92);align-items:center;justify-content:center;padding:12px}
.lu-in{background:var(--kortti);border-radius:var(--r);padding:14px;width:100%;max-width:520px;display:flex;flex-direction:column;gap:8px}
.lu-video{position:relative;background:#000;border-radius:12px;overflow:hidden;aspect-ratio:1}
.lu-video video{width:100%;height:100%;object-fit:cover;display:block}
.lu-kehys{position:absolute;inset:14%;border:3px solid rgba(255,255,255,.85);border-radius:16px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.lu-tila{font-weight:600;margin:0}
.lu-rivi .btn{width:100%}

/* ilmoitukset */
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#F4EFE6;padding:10px 16px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:70;max-width:92vw;font-size:.92rem}
.toast.on{opacity:1;transform:translateX(-50%)}
.ilmo{display:none}
.ilmo.on{display:flex;flex-direction:column;gap:6px;position:fixed;left:12px;right:12px;top:12px;z-index:65;max-width:520px;margin:0 auto;background:var(--kortti);border-radius:var(--r);padding:16px;box-shadow:0 20px 50px rgba(0,0,0,.5);border-top:6px solid var(--d1);animation:tulo .35s ease}
.ilmo.myota{border-top-color:var(--ok)}.ilmo.vasta{border-top-color:var(--vasta)}
.ilmo b{font-family:Georgia,serif;font-size:1.2rem}.ilmo p{margin:0}.ilmo .btn{align-self:flex-end}
@keyframes tulo{from{opacity:0;transform:translateY(-12px)}}

/* kriisit */
.kriisi{display:none}
.kriisi.on{display:flex;position:fixed;inset:0;z-index:55;background:rgba(40,8,8,.86);align-items:flex-start;justify-content:center;padding:16px;overflow-y:auto}
.kriisi.kari.on{background:rgba(48,28,4,.88)}
.kr-in{background:var(--kortti);border-radius:var(--r);padding:18px;width:100%;max-width:560px;border-top:8px solid #B3261E;display:flex;flex-direction:column;gap:8px;margin:auto 0}
.kriisi.kari .kr-in{border-top-color:var(--kulta)}
.kr-in .v-eye,.kriisi-j .v-eye{color:#B3261E}
.kriisi.kari .v-eye,.kriisi-j.kari .v-eye{color:#8A5A0E}
.kr-kuvaus{color:var(--ink2);margin:0}
.kr-vaihe{display:flex;justify-content:space-between;align-items:center;background:var(--ink);color:#F4EFE6;border-radius:12px;padding:10px 14px}
.kr-vaihe b{font:700 2rem/1 system-ui,sans-serif;font-variant-numeric:tabular-nums;color:#F4D58A}
.kr-apu{font-weight:700;margin:4px 0}
.kr-v{display:flex;gap:8px;align-items:flex-start;background:#fff;border:1px solid var(--viiva);border-radius:10px;padding:8px 10px}
.kr-v p{margin:0;font-size:.92rem}
.kriisi-j{border-top:8px solid #B3261E}.kriisi-j.kari{border-top-color:var(--kulta)}
.kriisi-j h2{font-size:2rem}.kriisi-j .kr-kuvaus{font-size:1.15rem}
.kriisi-j .kr-vaihe b{font-size:3.2rem}
.kr-vastaukset{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:8px}
.kriisi-j{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:18px;align-items:start}
.kr-qr{text-align:center}.kr-qr .qrbox{margin:6px 0}
@media (max-width:820px){.kriisi-j{grid-template-columns:1fr}}
.kr-ohj{display:flex;flex-direction:column;gap:6px;background:var(--kortti2);border-radius:12px;padding:10px;margin:8px 0}

/* alapalkki */
.ala{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;gap:8px;justify-content:center;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(15,27,38,.96);border-top:1px solid #24394A}
.ala[hidden]{display:none}
.ala .btn{flex:1;max-width:220px}
.ala .btn.pri{background:#F4D58A;color:var(--ink);border-color:#F4D58A}

@media (max-width:820px){
  .johto{grid-template-columns:1fr}
  .satamat{grid-template-columns:repeat(2,1fr)}
}
@media (max-width:560px){
  h1{font-size:2rem}
  .teot{grid-template-columns:1fr}
  .teko{min-height:0}
  .roolit{grid-template-columns:1fr}
  .varit{grid-template-columns:repeat(6,1fr)}
  .loki .lk,.tarkastelu .lk{grid-template-columns:1fr;gap:2px}
  .asteikko button{width:34px;height:34px}
}
@media (prefers-reduced-motion:reduce){.vene,.ilmo.on{animation:none}.toast{transition:none}}
</style>

  <button class="btn" id="aValikko" type="button">Valikko</button>
</nav>

<script>/* ═══════════════════════════════════════════════════════════════════════════
   PURJEHDUS — Double Diamond -peli luokkaan, 70 min

   Jokainen pelaa omalla kännykällään omassa selaimessaan. Mitään palvelinta
   ei ole: tieto kulkee puhelimesta toiseen QR-koodeina, jotka luetaan
   kameralla (tai otetaan kuva). Pelijohtajan näkymä näyttää pelin tilan
   QR-koodina; sataman ja luotsin leimat allekirjoitetaan pelijohtajan
   avaimella (ECDSA P-256), joten pelaaja ei voi tehdä niitä itse.

   REHELLISESTI: tila on pelaajan omassa selaimessa. Tekniikkaa osaava voi
   muuttaa sitä selaimen kehitystyökaluilla. Allekirjoitus estää leiman
   väärentämisen QR-koodina, ei paikallisen tilan muokkaamista.
   ═══════════════════════════════════════════════════════════════════════════ */
'use strict';

const KEY = 'purjehdus_v1';
const $ = id => document.getElementById(id);
const uid = (n = 6) => Array.from(crypto.getRandomValues(new Uint8Array(n)), b => 'abcdefghijkmnpqrstuvwxyz23456789'[b % 32]).join('');
const rivit = t => String(t || '').split('\n').map(x => x.trim()).filter(Boolean);
const lyh = (t, n) => { t = String(t || ''); return t.length > n ? t.slice(0, n - 1) + '…' : t; };

/* ── vaiheet ──────────────────────────────────────────────────────────────── */
const VAIHEET = [
  { v: 'lahto',    n: 'Lähtösatama',  dd: 'Aloitus',      m: 5,  k: 'yksin',
    t: 'Mitä meillä on, ja mikä saari kiehtoo?' },
  { v: 'discover', n: 'Sumuinen meri', dd: 'Discover',    m: 15, k: 'pari',
    t: 'Raivaa sumua: luotaa, käy satamakylissä, lue majakoita.' },
  { v: 'define',   n: 'Tähtikuviot',  dd: 'Define',       m: 12, k: 'ryhmä',
    t: 'Yhdistä löydöt oivallukseksi ja johda väylämerkit.' },
  { v: 'kapeikko', n: 'Kapeikko',     dd: 'Toimeksianto', m: 5,  k: 'luotsi',
    t: 'Lukitse kurssi. Luotsi päästää läpi.' },
  { v: 'telakka',  n: 'Telakka',      dd: 'Develop',      m: 15, k: 'ryhmä',
    t: 'Rakenna useita veneitä ja yhdistele niiden osia.' },
  { v: 'regatta',  n: 'Koepurjehdus', dd: 'Deliver',      m: 10, k: 'pari',
    t: 'Arvioi veneet väylämerkeillä. Kestääkö voittaja myrskyn?' },
  { v: 'ranta',    n: 'Rantautuminen', dd: 'Output',      m: 8,  k: 'yksin',
    t: 'Kirjoita lokikirja ja katso uutta horisonttia.' }
];
const KOKO = { yksin: 'Yksin', pari: 'Pareittain', 'ryhmä': 'Ryhmissä', luotsi: 'Luotsin kautta' };
const VNIMI = v => (VAIHEET.find(x => x.v === v) || {}).n || v;

const MENETELMA = {
  luotaus:  { n: 'Luotaus',     h: 'Oma havainto, kokeilu tai koestus', hinta: 3, luot: 3, met: 'Havainnointi', laji: 'havainto', paljastaa: 4 },
  kyla:     { n: 'Satamakylä',  h: 'Haastattelu tai keskustelu',        hinta: 2, luot: 2, met: 'Käyttäjähaastattelu', laji: 'mielipide', paljastaa: 3 },
  majakka:  { n: 'Majakka',     h: 'Kirjallisuus, data tai raportti',   hinta: 1, luot: 1, met: 'Kirjallisuus tai raportti', laji: 'fakta', paljastaa: 2 }
};
const MUONA_ALUSSA = 12;

/* ── liput: jokainen vene tunnistetaan väristä ja nimikirjaimista ─────────── */
const LIPUT = [
  ['#D94F3D', 'punainen'], ['#E8902E', 'oranssi'], ['#E9C53B', 'keltainen'], ['#5DAA45', 'vihreä'],
  ['#2E8C7E', 'turkoosi'], ['#3F7FCF', 'sininen'], ['#2B3F8F', 'laivastonsininen'], ['#7B4FB8', 'violetti'],
  ['#C2478F', 'pinkki'], ['#8A5A3B', 'ruskea'], ['#1E1E1E', 'musta'], ['#F2F0EA', 'valkoinen']
];
const lippuNimi = c => (LIPUT.find(x => x[0] === c) || [, 'lippu'])[1];
const tekstiVari = c => {
  const h = (c || '#888888').replace('#', '');
  const [r, g, b] = [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255);
  return (0.2126 * r + 0.7152 * g + 0.0722 * b) > 0.55 ? '#14212C' : '#FFFFFF';
};
const kirjaimet = n => {
  const o = String(n || '').trim().split(/\s+/).filter(Boolean);
  if (!o.length) return '??';
  return (o.length > 1 ? o[0][0] + o[o.length - 1][0] : o[0].slice(0, 2)).toUpperCase();
};
function lippuSvg(c, k, koko = 40) {
  const t = tekstiVari(c);
  return `<svg class="lippu" width="${koko * 1.4}" height="${koko}" viewBox="0 0 56 40" role="img" aria-label="${lippuNimi(c)} lippu ${k}">`
    + `<line x1="3" y1="2" x2="3" y2="40" stroke="var(--ink)" stroke-width="2.4"/>`
    + `<path d="M4 3 L52 3 L44 15 L52 27 L4 27 Z" fill="${c}" stroke="rgba(0,0,0,.35)" stroke-width="1"/>`
    + `<text x="24" y="20.5" text-anchor="middle" font-size="14" font-weight="800" fill="${t}" font-family="system-ui,sans-serif">${k}</text></svg>`;
}

/* ── tila ─────────────────────────────────────────────────────────────────── */
const UUSI_PELAAJA = () => ({
  osaaminen: '', ruuma: '', haaste: '', kenelle: '', oletukset: [],
  loydot: [], oivallus: '', oivallusLahteet: [], kriteerit: [],
  hmw: '', mittari: '', rajaus: '', kapeikkoAuki: false, raapaisu: false,
  veneet: [], arviot: {}, painot: {}, myrsky: null,
  opit: '', horisontti: '',
  muona: MUONA_ALUSSA, leimat: [], sovelletut: [], nonces: [],
  liitto: [],       /* [{id, n, li, ki, vi}] veneet, joihin on sidottu tässä vaiheessa */
  irrotettu: null, ankkuri: null,
  kirja: []         /* tapahtumakirja: jokainen teko, leima ja säätiedote muonan muutoksineen */
});
const BLANK = {
  v: 1, rooli: null, nimi: '', minaId: '', lippu: '', kirj: '',
  laivasto: {},     /* pelijohtaja: rekisteröidyt veneet */
  ohjaajat: [],     /* pelijohtaja: rekisteröidyt satamat ja luotsit */
  peli: null,       /* {id, nimi, pub, sched, start, seq, ev[]} */
  avain: null,      /* yksityinen avain: vain pelijohtaja ja opettajat */
  harjoitus: false,
  nakyma: null,     /* pelaajan valitsema vaihe */
  p: UUSI_PELAAJA(),
  annetut: []       /* opettajan antamat leimat */
};
let S = structuredClone(BLANK);
let saveT = null;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(saveNow, 250);
}
function saveNow() {
  clearTimeout(saveT); saveT = null;
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}
}
addEventListener('pagehide', saveNow);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') saveNow(); });
function load() {
  try {
    const o = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (!o || typeof o !== 'object') return false;
    S = Object.assign(structuredClone(BLANK), o);
    S.p = Object.assign(UUSI_PELAAJA(), o.p || {});
    return true;
  } catch (e) { return false; }
}

/* ── DOM ──────────────────────────────────────────────────────────────────── */
function el(tag, o, kids) {
  const n = document.createElement(tag);
  if (o) for (const [k, v] of Object.entries(o)) {
    if (k === 'text') n.textContent = v;
    else if (k === 'html') n.innerHTML = v;
    else if (k === 'on') for (const [e, f] of Object.entries(v)) n.addEventListener(e, f);
    else if (v !== null && v !== false && v !== undefined) n.setAttribute(k, v === true ? '' : v);
  }
  if (kids) for (const c of [].concat(kids)) if (c) n.append(c);
  return n;
}
const btn = (text, on, cls = '') => el('button', { class: 'btn ' + cls, type: 'button', text, on: { click: on } });
let toastT = null;
function toast(t, laji = '') {
  const n = $('toast');
  n.textContent = t; n.className = 'toast on ' + laji;
  clearTimeout(toastT); toastT = setTimeout(() => n.className = 'toast', 3800);
}
function ilmoitus(otsikko, teksti, laji = '') {
  const d = $('ilmo');
  d.innerHTML = '';
  d.className = 'ilmo on ' + laji;
  d.append(el('b', { text: otsikko }), el('p', { text: teksti }), btn('Selvä', () => d.className = 'ilmo'));
}

/* ── koodaus: JSON → (deflate) → base64url → QR-palat ─────────────────────── */
const b64u = bytes => {
  let s = ''; bytes.forEach(b => s += String.fromCharCode(b));

function tahtikuvio(n) {
  const pts = [];
  for (let i = 0; i < n; i++) {
    const a = (i / n) * Math.PI * 2 - Math.PI / 2, r = 46 + (i % 2) * 14;
    pts.push([110 + Math.cos(a) * r, 70 + Math.sin(a) * r * .7]);
  }
  let g = '<svg viewBox="0 0 220 140" aria-hidden="true">';
  g += `<polyline points="${[...pts, pts[0]].map(p => p.join(',')).join(' ')}" fill="var(--d1)" fill-opacity=".08" stroke="var(--d1)" stroke-width="1.4"/>`;
  pts.forEach(([x, y]) => g += `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--kulta)"/>`);
  return g + '</svg>';
}

/* ── 6 KOEPURJEHDUS: Deliver ─────────────────────────────────────────────── */
function painot() {
  const p = S.p, k = p.kriteerit;
  const raw = k.map(x => p.painot[x.id] ?? 1);
  const s = raw.reduce((a, b) => a + b, 0) || 1;
  return Object.fromEntries(k.map((x, i) => [x.id, raw[i] / s]));
}
function pisteet(w = painot()) {
  const p = S.p;
  return p.veneet.map(b => ({ b, s: p.kriteerit.reduce((a, k) => a + (w[k.id] || 0) * ((p.arviot[b.id] || {})[k.id] || 0), 0) }))
    .sort((a, b) => b.s - a.s);
}
/* Myrsky: painot heiluvat ±25 %, montako kertaa kukin vene voittaa. */
function myrsky(n = 600) {
  const p = S.p, w0 = painot();
  let seed = 12345;
  const rnd = () => (seed = (seed * 1103515245 + 12345) % 2147483648) / 2147483648;
  const voitot = Object.fromEntries(p.veneet.map(b => [b.id, 0]));
  for (let i = 0; i < n; i++) {
    const w = {};
    let s = 0;
    for (const k of p.kriteerit) { w[k.id] = w0[k.id] * (0.75 + rnd() * 0.5); s += w[k.id]; }
    for (const k in w) w[k] /= s;
    const top = pisteet(w)[0];
    if (top) voitot[top.b.id]++;

async function vastaanotaPelaaja(o) {
  if (!o || typeof o !== 'object') return;
  if (o.t === 'g') { liityPeliin(o); return; }
  if (o.t === 'k') {
    if (o.p === S.minaId) { toast('Tämä on oma karttasi.'); return; }
    const on = new Set(S.p.loydot.map(l => l.t));
    let n = 0;
    (o.lo || []).forEach(([t, tapa]) => {
      if (on.has(t)) return;
      S.p.loydot.push({ id: uid(), t, tapa: MENETELMA[tapa] ? tapa : 'kyla', src: 'kumppani', kuka: o.n || 'kumppani' });
      n++;
    });
    const veOn = new Set(S.p.veneet.map(b => b.nimi));
    let nv = 0;
    (o.ve || []).forEach(nimi => { if (veOn.has(nimi)) return; S.p.veneet.push({ id: uid(), nimi, kuvaus: '', src: 'liitto', kuka: o.n || '' }); nv++; });
    const kl = kello(), vi = kl.alkanut ? kl.i : -1;
    kirjaa('liitto', 0, { kenen: o.p, ki: o.ki, n: o.n, loydot: n, veneet: nv });
    S.p.liitto = S.p.liitto.filter(a => !(a.id === o.p && a.vi === vi));
    S.p.liitto.push({ id: o.p, n: o.n || '', li: o.li || '#888888', ki: o.ki || kirjaimet(o.n), vi });
    save(); render();
    ilmoitus(`Sidottu veneeseen ${o.ki || ''}`, `${n ? `Merikortista ${n} uutta löytöä. ` : ''}${nv ? `Telakalle ${nv} liittolaisen venettä yhdisteltäväksi. ` : ''}Yhdessä kestätte myrskyn tämän vaiheen ajan. Muista, että myös toisen veneen pitää lukea sinun koodisi.`, 'myota');
    return;
  }
  if (o.t === 'm') { await vastaanotaLeima(o); return; }
  if (o.t === 'a') { vastaanotaVastaus(o); return; }
  if (o.t === 'o') { toast('Tämä on opettajan avain. Pelaaja ei tarvitse sitä.'); return; }
  if (o.t === 'l') { toast('Tämä on toisen pelaajan lasti — sen lukee opettaja.'); return; }
  toast('Tuntematon koodi.');
}
async function vastaanotaLeima(m) {
  if (!S.peli || m.g !== S.peli.id) { toast('Leima on toisesta pelistä.'); return; }
  if (m.p !== S.minaId) { toast('Tämä leima on jonkun toisen.'); return; }
  if (S.p.nonces.includes(m.nonce)) { toast('Tämä leima on jo käytetty.'); return; }
  if (!kryptoOk()) { toast('Selain ei pysty tarkistamaan leimaa tässä näkymässä.'); return; }
  if (!(await tarkista(m, S.peli.pub))) { toast('Leima ei ole aito.', 'vasta'); return; }
  S.p.nonces.push(m.nonce);
  S.p.leimat.push(Object.assign({}, m, { ts: Date.now() }));
  if (m.v) S.p.muona += +m.v;
  kirjaa('leima', +m.v || 0, { m });
  if (m.k === 'luotsi') { avaaKapeikko('luotsi'); return; }
  save(); render();
  ilmoitus(m.k === 'satama' ? `Satama: ${m.by || ''}` : 'Leima', [m.v ? `+${m.v} muonaa.` : '', m.txt || ''].filter(Boolean).join(' '), 'myota');
}

/* ── liittyminen ja säätiedotteet ────────────────────────────────────────── */
async function liityPeliin(g) {
  const uusi = !S.peli || S.peli.id !== g.id;
  if (uusi && S.peli && S.p.haaste && !confirm('Liitytäänkö uuteen peliin? Nykyinen pelitila nollataan.')) return;
  if (uusi) { S.p = UUSI_PELAAJA(); S.nakyma = null; }
  const vanhat = S.peli && S.peli.id === g.id ? S.peli.ev || [] : [];
  S.peli = { id: g.id, nimi: g.nimi, pub: g.pub, sched: g.sched, start: g.start, seq: g.seq, ev: g.ev || [] };
  S.harjoitus = false;
  if (!S.rooli) S.rooli = 'pelaaja';
  const uudet = (g.ev || []).filter(e => !S.p.sovelletut.includes(e.id));
  const viestit = [];
  let huono = false;
  for (const e of uudet) {
    S.p.sovelletut.push(e.id);
    if (S.rooli !== 'pelaaja' || uusi) continue;
    if (e.myrsky) {
      const sid = liitossa();
      if (sid.length) {
        viestit.push(`${e.txt} — veneet sidottu yhteen (${sid.map(a => a.ki).join(', ')}): kestitte myrskyn ilman menetyksiä.`);
        kirjaa('myrsky', 0, { e, kesti: true, liitto: sid.map(a => a.ki) });
      } else {
        const ennen = S.p.muona;
        S.p.muona = Math.max(0, S.p.muona + (e.mu || -3)); huono = true;
        viestit.push(`${e.txt} — yksin ulapalla: ${e.mu || -3} muonaa.`);
        kirjaa('myrsky', S.p.muona - ennen, { e, kesti: false });
      }
    } else {
      if (e.mu > 0) {
        const aito = e.sig && kryptoOk() && await tarkistaTeksti(saaTeksti(g.id, e), e.sig, g.pub);
        if (!aito) { viestit.push(`${e.txt} — säätiedotteen allekirjoitus ei täsmää, muonaa ei lisätty`); continue; }
      }
      const ennen = S.p.muona;
      if (e.mu) S.p.muona = Math.max(0, S.p.muona + e.mu);
      if (e.mu < 0) huono = true;
      if (e.mu) kirjaa('saa', S.p.muona - ennen, { e });
      viestit.push(e.txt + (e.mu ? ` (${e.mu > 0 ? '+' : ''}${e.mu} muonaa)` : ''));
    }
  }
  const krMuuttui = !uusi && S.rooli === 'pelaaja' && kriisiPaivita(g);
  if (uusi && S.rooli === 'pelaaja') kriisiPaivita(g);
  save(); render();
  if (krMuuttui && S.kriisi && !S.kriisi.ohi) return;
  if (uusi) {
    toast(`Liityit peliin ${g.nimi}.`);
    if (S.rooli === 'pelaaja') naytaVenekortti();
  } else if (viestit.length) ilmoitus('Säätiedote', viestit.join(' · '), huono ? 'vasta' : 'myota');
  else toast('Pelin tila päivitetty.');
}

/* ── tiedonkeruuprofiili muonan käytöstä ─────────────────────────────────── */
function profiili() {
  const kulu = { luotaus: 0, kyla: 0, majakka: 0 };
  S.p.kirja.filter(k => k.tapa === 'teko').forEach(k => { kulu[k.x.m] = (kulu[k.x.m] || 0) - k.d; });
  const yht = kulu.luotaus + kulu.kyla + kulu.majakka;
  let tyyppi = 'Ei vielä tutkimusta', kuvaus = '';
  if (yht) {
    if (kulu.luotaus / yht >= 0.5) { tyyppi = 'Syvällinen tutkija'; kuvaus = 'Yli puolet muonasta meni omiin luotauksiin: kallista mutta luotettavaa tietoa.'; }
    else if (kulu.majakka / yht >= 0.5) { tyyppi = 'Nopea etenijä'; kuvaus = 'Yli puolet muonasta meni majakoihin: nopeaa, mutta toisen käden tietoa.'; }
    else { tyyppi = 'Monipuolinen luotsi'; kuvaus = 'Muona jakautui usealle tiedonlähteelle.'; }
  }
  return { kulu, yht, tyyppi, kuvaus };
}

  const out = {

    }).concat(p.oletukset.filter(o => o.koe).map(o => ({

    }))).concat((p.apu || []).map((a, i) => ({

    }))).concat(p.leimat.filter(m => m.txt).map(m => ({

    }))),
    insights: ins ? [ins] : [],
    criteria: kr,
    brief: { hmw: p.hmw.trim() === 'Miten voisimme' ? '' : p.hmw, mukana: '', ulkopuolella: p.rajaus, mittarit: p.mittari, locked: p.kapeikkoAuki },

/* Korostaa näkymän termit: kukin termi kerran per näkymä. */
const SANA_KOHTEET = '.ohje, .f > span, .f-l > span, .l-h > b, .vaihe > h2, .jako > b, .jako > p, .huom, .luovi p, .alku p, .yla-v b';
function kytkeSanat(juuri) {
  const nahty = new Set();
  juuri.querySelectorAll(SANA_KOHTEET).forEach(kohde => {
    const tw = document.createTreeWalker(kohde, NodeFilter.SHOW_TEXT);
    const solmut = [];
    while (tw.nextNode()) solmut.push(tw.currentNode);
    solmut.forEach(n => {
      if (n.parentElement.closest('.sana, button, a')) return;
      let teksti = n.nodeValue, frag = null, m;
      const re = new RegExp(SANA_RE.source, 'gi');
      let viim = 0;
      while ((m = re.exec(teksti))) {
        const t = sanaTermi(m[2]);
        if (!t || nahty.has(t[0])) continue;
        nahty.add(t[0]);
        frag = frag || document.createDocumentFragment();
        const alku = m.index + m[1].length;
        frag.append(document.createTextNode(teksti.slice(viim, alku)));
        frag.append(el('span', { class: 'sana', role: 'button', tabindex: '0', 'data-sana': t[0], title: `${t[0]}: napauta, niin selitys aukeaa`, text: m[2] + m[3] }));
        viim = alku + m[2].length + m[3].length;

      if (frag) { frag.append(document.createTextNode(teksti.slice(viim))); n.replaceWith(frag); }

/* Sanapilvet: siemennetty satunnaisuus, jotta korkeudet pysyvät paikallaan uudelleenpiirrossa. */
function sanapilvet(sanat, siemen = 7) {
  let s = siemen;
  const r = () => (s = (s * 9301 + 49297) % 233280) / 233280;
  const box = el('div', { class: 'pilvet', 'aria-hidden': 'true' });
  sanat.forEach((t, i) => {
    const kesto = 34 + r() * 30;
    box.append(el('span', {
      class: 'pilvi' + (r() > .7 ? ' iso' : ''),
      style: `top:${4 + (i * 29 % 78) + r() * 6}%;animation-duration:${kesto.toFixed(1)}s;animation-delay:${(-r() * kesto).toFixed(1)}s;opacity:${(.45 + r() * .45).toFixed(2)}`,
      text: t
    }));
  });
  return box;
}

/* ═══ SUMU, KARIKOT JA SIIRTYMÄT ════════════════════════════════════════════

   Kaikki uusi on sumun peitossa. Sumu ohenee satamasta sitä mukaa kuin
   vaiheen kohtia täytetään, ja seuraavaan satamaan voi purjehtia vasta kun
   edellinen on selvitetty. Karikot (oletukset) piilevät reitin varrella
   sumun alla ja tulevat näkyviin, kun ne koetellaan.

   Jokainen siirtymä satamasta toiseen näytetään lyhyenä animaationa: vene
   liikkuu, ja taivaalla purjehtivat pelaajan itse kirjoittamat sanat.
   ═══════════════════════════════════════════════════════════════════════════ */

/* Kuinka pitkälle vaihe on selvitetty: 0 = sumussa, 1 = kirkas. */
function edistyminen(v) {
  const p = S.p;
  const kr = p.kriteerit.filter(k => !EPAMAAR.test(k.t.trim())).length;
  switch (v) {
    case 'lahto': return [p.osaaminen.trim().length >= 3, p.ruuma.trim().length >= 3, p.haaste.trim().length >= 15, p.kenelle.trim().length >= 3, p.oletukset.length >= 1].filter(Boolean).length / 5;
    case 'discover': return Math.min(1, Math.min(p.loydot.length, 3) / 3 * 0.7 + (p.loydot.some(l => l.tapa === 'luotaus' && l.src === 'oma') ? 0.3 : 0));
    case 'define': return Math.min(1, (p.oivallus.trim() ? 0.35 : 0) + Math.min(p.oivallusLahteet.length, 2) / 2 * 0.25 + Math.min(kr, 2) / 2 * 0.4);
    case 'kapeikko': return p.kapeikkoAuki ? 1 : Math.min(0.9, (p.hmw.trim().length > 20 ? 0.45 : 0) + (p.mittari.trim() ? 0.3 : 0) + (p.rajaus.trim() ? 0.15 : 0));
    case 'telakka': return Math.min(1, p.veneet.length / 3);
    case 'regatta': {
      const n = p.veneet.length * p.kriteerit.length;
      if (!n) return 0;
      let t = 0; p.veneet.forEach(b => p.kriteerit.forEach(k => { if ((p.arviot[b.id] || {})[k.id]) t++; }));
      return t / n;
    }
    case 'ranta': return p.ankkuri ? 1 : (p.opit.trim() ? 0.7 : 0);
  }
  return 0;
}
const vaiheIndeksi = v => VAIHEET.findIndex(x => x.v === v);
/* Satamaan pääsee, kun edellinen on selvitetty. */
function saavutettava(v) {
  const i = vaiheIndeksi(v);
  if (i <= 0) return true;
  return vaiheValmis(VAIHEET[i - 1].v) && !lukittu(v);
}
function mitaPuuttuu(v) {
  const p = S.p;
  switch (v) {
    case 'lahto': return 'täydennä lähtövalmius (miehistö, ruuma, saari, kenelle, karikot)';
    case 'discover': return 'kirjaa vähintään kolme löytöä, joista yksi omaa luotausta';
    case 'define': return 'nimeä oivallus kahdesta tähdestä ja johda kaksi mitattavaa väylämerkkiä';
    case 'kapeikko': return 'lukitse kurssi ja hae luotsin leima';
    case 'telakka': return `rakenna vielä ${Math.max(0, 3 - p.veneet.length)} venettä`;
    case 'regatta': return 'arvioi jokainen vene jokaisella väylämerkillä';
  }
  return 'selvitä edellinen satama';
}

/* ── sumu ja karikot merikortille ────────────────────────────────────────── */
function sumuJaKarikot(X, Y) {
  let g = `<defs><filter id="sumuBlur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="9"/></filter></defs>`;
  /* karikot reitin varrella ensimmäisessä timantissa */
  const ol = S.p.oletukset.slice(0, 7);
  const kohdat = ol.map((o, j) => {
    const t = (j + 1) / (ol.length + 1);
    const x = X[0] + (X[3] - X[0]) * t, y = 150 + (j % 2) * 16;
    return { o, x, y };
  });
  const piilossa = kohdat.filter(k => !k.o.koe);
  const nakyvat = kohdat.filter(k => k.o.koe);
  piilossa.forEach(k => {
    g += `<g class="karikko piilossa" opacity=".55"><path d="M${k.x - 9} ${k.y + 5} l5 -9 l6 3 l5 -6 l5 12 z" fill="none" stroke="var(--ink3)" stroke-dasharray="2 2"/><text x="${k.x}" y="${k.y + 2}" text-anchor="middle" class="k-pieni">?</text></g>`;
  });
  /* sumu: jokaisen sataman ympärillä pilvi, jonka tiheys = 1 − edistyminen */
  const viimeisin = VAIHEET.reduce((a, v, i) => saavutettava(v.v) ? i : a, 0);
  VAIHEET.forEach((v, i) => {
    const tiheys = vaiheValmis(v.v) ? 0 : i <= viimeisin ? 1 - edistyminen(v.v) * 0.9 : 1;
    if (tiheys < 0.08) return;
    const o = (i <= viimeisin ? 0.75 : 0.92) * tiheys;
    g += `<g class="sumu s${i % 3}" filter="url(#sumuBlur)" opacity="${o.toFixed(2)}" pointer-events="none">`
      + `<ellipse cx="${X[i] - 16}" cy="${Y[i] - 4}" rx="30" ry="20" fill="#F7FAFB"/>`
      + `<ellipse cx="${X[i] + 14}" cy="${Y[i] + 6}" rx="34" ry="22" fill="#F2F6F8"/>`
      + `<ellipse cx="${X[i] + 2}" cy="${Y[i] - 18}" rx="26" ry="16" fill="#FFFFFF"/></g>`;
  });
  /* tuntematon meri saavuttamattomien satamien takana */
  if (viimeisin < VAIHEET.length - 1) {
    const x0 = (X[viimeisin] + X[viimeisin + 1]) / 2;
    g += `<defs><linearGradient id="sumuVerho" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#F4F7F8" stop-opacity="0"/><stop offset=".25" stop-color="#F4F7F8" stop-opacity=".55"/><stop offset="1" stop-color="#EEF3F5" stop-opacity=".8"/></linearGradient></defs>`;
    g += `<rect x="${x0}" y="0" width="${720 - x0}" height="210" fill="url(#sumuVerho)" pointer-events="none"/>`;
    g += `<text x="${(x0 + 720) / 2}" y="198" text-anchor="middle" class="k-pieni sumu-teksti">sumun peitossa</text>`;
  }
  /* koetellut karikot sumun päällä: piti = poiju, ei pitänyt = merkitty kivikko */
  nakyvat.forEach(k => {
    g += k.o.koe === 'piti'
      ? `<g class="karikko poiju"><title>Karikko koeteltu: piti paikkansa</title><path d="M${k.x} ${k.y - 12} l6 10 h-12 z" fill="var(--ok)"/><rect x="${k.x - 4}" y="${k.y - 2}" width="8" height="7" rx="2" fill="var(--ok)"/></g>`
      : `<g class="karikko kivi"><title>Karikko koeteltu: ei pitänyt — kierretty</title><path d="M${k.x - 10} ${k.y + 6} l6 -11 l6 4 l5 -7 l6 14 z" fill="#3B4650"/><path d="M${k.x - 5} ${k.y - 14} l10 10 M${k.x + 5} ${k.y - 14} l-10 10" stroke="var(--vasta)" stroke-width="2.4"/></g>`;
  });
  return g;
}

/* ── pelaajan omat sanat siirtymän taivaalle ─────────────────────────────── */
function omatSanat(v) {
  const p = S.p;
  const lyhyt = t => { const w = String(t || '').trim().split(/\s+/).filter(Boolean); return w.length > 5 ? w.slice(0, 5).join(' ') + '…' : w.join(' '); };
  let s = [];
  if (v === 'lahto') s = [p.haaste, p.kenelle, ...p.oletukset.map(o => o.t)];
  if (v === 'discover') s = p.loydot.map(l => l.t);
  if (v === 'define') s = [p.oivallus, ...p.kriteerit.map(k => k.t)];
  if (v === 'kapeikko') s = [p.hmw, p.mittari, p.rajaus];
  if (v === 'telakka') s = p.veneet.map(b => b.nimi);
  if (v === 'regatta') { const t = vaiheValmis('regatta') ? pisteet()[0] : null; s = [t && t.b.nimi, ...p.kriteerit.map(k => k.t)]; }
  s = s.map(lyhyt).filter(x => x && x !== 'Miten voisimme').slice(0, 8);
  return s.length ? s : SANAT_LAHTO.slice(0, 5);
}

/* ── siirtymä satamasta toiseen ──────────────────────────────────────────── */
function siirry(v, opt = {}) {
  if (!saavutettava(v) && !opt.pakota) {
    const i = vaiheIndeksi(v), ed = VAIHEET[Math.max(0, i - 1)];
    toast(`Sumu on vielä sakeaa. Selvitä ensin ${ed.n}: ${mitaPuuttuu(ed.v)}.`);
    return false;
  }
  const mista = S.nakyma;
  S.nakyma = v;
  save();
  render();
  if (vaiheIndeksi(v) > vaiheIndeksi(mista)) siirtyma(mista, v);
  return true;
}
function siirtyma(mista, mihin) {
  if (window.PJ_EI_ANIM || S.eiAnim) return;
  const a = VAIHEET.find(x => x.v === mista) || VAIHEET[0], b = VAIHEET.find(x => x.v === mihin);
  const vahan = matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const box = $('siirtyma');
  box.innerHTML = '';
  box.className = 'siirtyma on' + (vahan ? ' vahan' : '');
  const sanat = el('div', { class: 's-sanat', 'aria-hidden': 'true' });
  omatSanat(mista).forEach((t, i) => sanat.append(el('span', { style: `top:${8 + (i * 23) % 60}%;animation-delay:${(-i * 0.4).toFixed(2)}s`, text: t })));
  box.append(sanat,
    el('div', { class: 's-otsikko' }, [
      el('span', { class: 's-eye', text: 'PURJEHDITAAN' }),
      el('b', { text: `${a.n} → ${b.n}` }),
      el('p', { text: b.t })
    ]),
    el('div', { class: 's-meri', html: `<svg viewBox="0 0 800 120" preserveAspectRatio="none" aria-hidden="true">
      <path d="M0 70 q 50 -10 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 t 100 0 V120 H0 Z" fill="#1E4A63"/>
      <path class="s-aalto" d="M0 84 q 40 -8 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 t 80 0 V120 H0 Z" fill="#163A4F"/></svg>` }),
    el('div', { class: 's-satamat' }, [el('span', { text: a.n }), el('span', { text: b.n })]),
    el('div', { class: 's-vene', html: `<svg viewBox="0 0 60 60" aria-hidden="true"><path d="M8 44 L52 44 L46 52 L14 52 Z" fill="#F4EFE6"/><line x1="30" y1="44" x2="30" y2="6" stroke="#F4EFE6" stroke-width="2"/><path d="M32 8 L32 42 L50 42 Z" fill="#FFFDF7"/><path d="M28 12 L28 42 L14 42 Z" fill="#FFFDF7" opacity=".85"/><path d="M30 6 L40 9 L30 12 Z" fill="${S.lippu || '#E9C53B'}"/></svg>` }),
    el('p', { class: 's-ohita', text: 'Napauta jatkaaksesi' })
  );
  let auki = true;
  const sulje = () => { if (!auki) return; auki = false; box.className = 'siirtyma'; box.innerHTML = ''; };
  box.onclick = sulje;
  setTimeout(sulje, vahan ? 1400 : 3400);
}
</script>
